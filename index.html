// O "plano" de cada idade: o que eu colocaria para começar.
// (Inglês fica de fora porque a seção Inglês já dá pontos pelo tempo de estudo.)
const PLAN_VERSION = '2'; // aumentar quando o plano ganhar tarefas novas, para o aviso voltar
const AGE_PLAN = {
  b1: ['lib_toysBox', 'lib_brushHelp', 'lib_diaperBin', 'lib_shoesPlace', 'lib_lineHang', 'lib_lineTake'],
  b2: ['taskPutToysAway', 'lib_washOwnPlate', 'taskBrushTeeth', 'taskLaundryBasket', 'lib_dressHelp', 'lib_washHands', 'lib_read10', 'lib_lineHang', 'lib_lineTake'],
  b3: ['taskPutToysAway', 'lib_washOwnPlate', 'lib_sweep', 'lib_mop', 'taskMakeBed', 'taskBrushTeeth', 'lib_backpack', 'lib_hangTowel', 'lib_read10'],
  b4: ['taskPutToysAway', 'lib_washOwnPlate', 'lib_sweep', 'lib_mop', 'taskMakeBed', 'taskBrushTeeth', 'lib_homework', 'taskRead15', 'lib_hangTowel'],
  b5: ['lib_washDishes', 'lib_sweep', 'lib_mop', 'taskMakeBed', 'lib_tidyRoom', 'lib_study30', 'lib_helpSibling']
};

function bandOf(age) { return AGE_BANDS.find(b => age >= b.min && age <= b.max) || AGE_BANDS[AGE_BANDS.length - 1]; }
function libItem(key) { return TASK_LIBRARY.find(x => x.key === key) || null; }
function isPlanned(sug, c) { return (AGE_PLAN[bandOf(c.age).id] || []).includes(sug.key); }
function suggestionsFor(c) {
  const age = Math.max(1, c.age);
  return TASK_LIBRARY.filter(x => age >= x.min && age <= x.max)
    .sort((a, b) => (isPlanned(b, c) - isPlanned(a, c)));
}
function normName(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
/** Encontra a tarefa que já existe para esta sugestão (pela chave ou por um nome parecido). */
function findTaskFor(sug) {
  const byKey = S.tasks.find(x => x.nameKey === sug.key);
  if (byKey) return byKey;
  if (!sug.alias) return null;
  const re = new RegExp(normName(sug.alias.source));
  return S.tasks.find(x => !x.nameKey && re.test(normName(x.name))) || null;
}
/** Situação da sugestão para a criança: 'has' (já tem), 'other' (existe para outras crianças), 'new' */
function suggestionState(sug, c) {
  const task = findTaskFor(sug);
  if (!task) return { state: 'new' };
  return taskForChild(task, c) ? { state: 'has', task } : { state: 'other', task };
}
function addSuggestion(sug, c) {
  const st = suggestionState(sug, c);
  if (st.state === 'has') return false;
  if (st.state === 'other') { if (!st.task.childIds.includes(c.id)) st.task.childIds.push(c.id); return true; }
  let id = Date.now(); while (taskById(id)) id++;
  S.tasks.push({ id, name: t(sug.key), nameKey: sug.key, points: sug.points, icon: sug.icon, frequency: 'daily', days: [...(sug.days || [])], time: '', approvalRequired: true, childIds: [c.id], cashPerPoint: null, fixedCash: 0 });
  return true;
}
/** Tarefas da lista que a criança tem, mas que não combinam com a idade dela. */
function planMismatch(c) {
  return S.tasks.filter(task => task.nameKey && taskForChild(task, c)).map(task => ({ task, sug: libItem(task.nameKey) }))
    .filter(({ sug }) => sug && (c.age < sug.min || c.age > sug.max));
}
function removeChildFromTask(task, c) {
  if (!task.childIds.length) task.childIds = S.children.map(k => k.id);
  task.childIds = task.childIds.filter(id => id !== c.id);
  if (!task.childIds.length) S.tasks = S.tasks.filter(x => x !== task);
}
function planFor(c) { return (AGE_PLAN[bandOf(c.age).id] || []).map(libItem).filter(Boolean); }
function planMissing() { return S.children.reduce((n, c) => n + planFor(c).filter(s => suggestionState(s, c).state !== 'has').length + planMismatch(c).length, 0); }
function sugDays(sug) { return sug.days && sug.days.length ? sug.days.map(d => weekdayNames(true)[d]).join(', ') : t('everyDay'); }

/* ---------- janela: sugestões de uma criança ---------- */
function openLibrary(childId) {
  const kids = S.children; ui.libChild = childById(childId) ? childId : (ui.libChild && childById(ui.libChild) ? ui.libChild : kids[0].id);
  Modal.open({ id: 'libModal', wide: true, title: '💡 ' + t('libTitle'), body: '<div id="libBody"></div>' });
  renderLibrary();
}
function renderLibrary() {
  const el = $('#libBody'); if (!el) return;
  const c = childById(ui.libChild), band = bandOf(c.age);
  const list = suggestionsFor(c);
  const rows = list.map(sug => {
    const st = suggestionState(sug, c);
    const right = st.state === 'has' ? `<span class="pill ok">✔ ${t('libHas')}</span>`
      : `<button type="button" class="btn btn-primary btn-sm" data-act="lib-add" data-id="${sug.key}">+ ${t(st.state === 'other' ? 'libAddChild' : 'libAdd')}</button>`;
    return `<div class="item"><div class="meta"><span class="ico">${esc(sug.icon)}</span><div><strong>${esc(st.task ? taskName(st.task) : t(sug.key))}</strong><div class="sub">+${pts(sug.points)} · ${esc(sugDays(sug))}${isPlanned(sug, c) ? ' · ⭐ ' + t('libRecommended') : ''}</div></div></div><div class="right">${right}</div></div>`;
  }).join('');
  const missingRec = planFor(c).filter(s => suggestionState(s, c).state !== 'has').length;
  el.innerHTML = `<div class="picker-row">${S.children.map(k => `<button type="button" class="picker ${k.id === c.id ? 'on' : ''}" style="--c:${k.accentColor}" data-act="lib-child" data-id="${esc(k.id)}">${avatar(k, 'sm')}<span>${esc(k.name)}<small>${years(k.age)}</small></span></button>`).join('')}</div>
    <div class="notice" style="margin-bottom:12px"><strong>${esc(t('libBand_' + band.id))}</strong> — ${esc(t('libTip_' + band.id))}</div>
    <button type="button" class="btn btn-soft btn-block" style="margin-bottom:12px" data-act="plan-open">👨‍👩‍👧 ${t('planOpen')}</button>
    <div class="list">${rows}</div>
    ${missingRec ? `<button type="button" class="btn btn-primary btn-block mt" data-act="lib-add-rec">⭐ ${t('libAddRec', { n: missingRec })}</button>` : ''}
    <p class="hint">${t('libHint')}</p>`;
}

/* ---------- janela: plano da família (todas as crianças de uma vez) ---------- */
function openPlan() {
  Modal.close('libModal');
  ui.planOff = new Set(); ui.planKeep = new Set();
  Modal.open({ id: 'planModal', wide: true, title: '👨‍👩‍👧 ' + t('planTitle'), body: '<div id="planBody"></div>' });
  renderPlan();
}
function renderPlan() {
  const el = $('#planBody'); if (!el) return;
  let total = 0;
  const blocks = S.children.map(c => {
    const items = planFor(c).map(sug => {
      const st = suggestionState(sug, c), id = `${c.id}|${sug.key}`, has = st.state === 'has';
      const on = !has && !ui.planOff.has(id); if (on) total++;
      return `<label class="plan-item ${has ? 'has' : ''}"><input type="checkbox" data-change="plan-toggle" data-id="${esc(id)}" ${has ? 'checked disabled' : on ? 'checked' : ''}><span class="ico">${esc(sug.icon)}</span><span class="plan-name"><b>${esc(st.task ? taskName(st.task) : t(sug.key))}</b><small>${has ? '✔ ' + t('libHas') : `+${pts(sug.points)} · ${esc(sugDays(sug))}`}</small></span></label>`;
    }).join('');
    const mm = planMismatch(c).map(({ task, sug }) => {
      const id = `${c.id}|${task.id}`, on = !ui.planKeep.has(id); if (on) total++;
      return `<label class="plan-item rm"><input type="checkbox" data-change="plan-rm" data-id="${esc(id)}" ${on ? 'checked' : ''}><span class="ico">${esc(task.icon)}</span><span class="plan-name"><b>${esc(taskName(task))}</b><small>${esc(t('planAgeRange', { min: sug.min, max: sug.max }))}</small></span></label>`;
    }).join('');
    return `<div class="plan-child" style="--c:${c.accentColor}"><div class="plan-head">${avatar(c, 'sm')}<div><strong>${esc(c.name)}</strong><div class="sub">${years(c.age)} · ${esc(t('libBand_' + bandOf(c.age).id))}</div></div></div><div class="plan-sub">➕ ${t('planAddTitle')}</div><div class="plan-list">${items}</div>${mm ? `<div class="plan-sub">➖ ${t('planRemoveTitle')}</div><div class="plan-list">${mm}</div>` : ''}</div>`;
  }).join('');
  el.innerHTML = `<p class="hint" style="margin-top:0">${t('planIntro')}</p>${blocks}
    <div class="row-actions mt"><button type="button" class="btn btn-primary btn-block" data-act="plan-apply" ${total ? '' : 'disabled'}>✅ ${total ? t('planApply', { n: total }) : t('planNothing')}</button></div>
    <p class="hint">${t('planHint')}</p>`;
}
function applyPlan() {
  let n = 0;
  // primeiro tira o que não combina com a idade (antes de incluir, para não confundir "todas as crianças")
  S.children.forEach(c => planMismatch(c).forEach(({ task }) => { if (!ui.planKeep.has(`${c.id}|${task.id}`)) { removeChildFromTask(task, c); n++; } }));
  S.children.forEach(c => planFor(c).forEach(sug => { if (!ui.planOff.has(`${c.id}|${sug.key}`) && addSuggestion(sug, c)) n++; }));
  if (!n) return;
  try { localStorage.setItem('familiaMissao.planHide', PLAN_VERSION); } catch (e) {}
  commit(); Modal.close('planModal');
  toast(t('planDone', { n }), 'success', { label: '🖨️ ' + t('planPrintNow'), run: () => openPrintChooser() }, 9000);
}
function planBannerHtml() {
  if (isChildMode()) return '';
  let hidden = false; try { hidden = localStorage.getItem('familiaMissao.planHide') === PLAN_VERSION; } catch (e) {}
  if (hidden || !planMissing()) return '';
  return `<div class="notice plan-banner"><span>✨ ${t('planBanner')}</span><span class="actions"><button type="button" class="btn btn-primary btn-sm" data-act="plan-open">${t('planBannerBtn')}</button><button type="button" class="icon-btn" data-act="plan-hide" aria-label="${esc(t('close'))}">✕</button></span></div>`;
}

Object.assign(ACTIONS, {
  'lib-open': el => openLibrary(el.dataset.id),
  'lib-child': el => { ui.libChild = el.dataset.id; renderLibrary(); },
  'lib-add': el => {
    const c = childById(ui.libChild), sug = libItem(el.dataset.id);

    planFor(c).forEach(s => { if (addSuggestion(s, c)) n++; });

  },
  'plan-open': () => openPlan(),
  'plan-apply': () => applyPlan(),
  'plan-hide': () => { try { localStorage.setItem('familiaMissao.planHide', PLAN_VERSION); } catch (e) {} const b = $('#dPlan'); if (b) b.innerHTML = ''; }

Object.assign(CHANGES, {

};
const EN_NUMBERS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
const EN_PLURAL_OK = ['star', 'cat', 'dog', 'ball', 'tree', 'flower', 'car', 'book', 'apple', 'duck', 'bird', 'hat'];
const EN_DRAW_OK = [['apple', ['red', 'green']], ['star', ['yellow', 'blue']], ['ball', ['blue', 'red', 'green']], ['house', ['blue', 'yellow']], ['flower', ['purple', 'red', 'yellow']], ['car', ['red', 'blue', 'green']], ['fish', ['orange', 'blue']], ['tree', ['green']]];
const EN_LEVELS = { 1: { name: 'Starter', ages: '3–4' }, 2: { name: 'Explorer', ages: '5–6' }, 3: { name: 'Adventurer', ages: '7+' } };

/* ---------- números aleatórios com semente (a mesma provinha pode ser reimpressa) ---------- */
function seededRng(seed) {
  let h = 1779033703 ^ String(seed).length;
  for (let i = 0; i < String(seed).length; i++) { h = Math.imul(h ^ String(seed).charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t2 = Math.imul(a ^ (a >>> 15), 1 | a); t2 = (t2 + Math.imul(t2 ^ (t2 >>> 7), 61 | t2)) ^ t2; return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296; };
}
function shuffle(arr, rnd) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(arr, n, rnd) { return shuffle(arr, rnd).slice(0, n); }
function plural(w) { return ['fish'].includes(w) ? w : w + 's'; }

/* ---------- gerador da provinha ---------- */
function buildEnglishTest(level, seed) {
  const rnd = seededRng(seed);
  const S1 = [];
  const nouns = [...EN_WORDS.animals, ...EN_WORDS.things, ...EN_WORDS.food.filter(([w]) => w !== 'orange')];
  const colors = EN_WORDS.colors.filter(([w]) => w !== 'white' && w !== 'black');
  if (level === 1) {
    const easy = [...EN_WORDS.animals.slice(0, 8), ...EN_WORDS.things.slice(0, 8), ...EN_WORDS.food.slice(0, 5)];
    S1.push({ type: 'circle', title: 'Listen and circle.', help: 'wsH_listenCircle', items: pick(easy, 4, rnd).map(target => { const opts = shuffle([target, ...pick(easy.filter(x => x !== target), 2, rnd)], rnd); return { opts, answer: target[0] }; }) });
    S1.push({ type: 'colorCircles', title: 'Color the circles.', help: 'wsH_colorCircles', items: pick(colors.slice(0, 6), 4, rnd).map(([w]) => ({ word: w, answer: w })) });
    S1.push({ type: 'countCircle', title: 'Count and circle the number.', help: 'wsH_countCircle', items: pick(nouns.filter(([w]) => EN_PLURAL_OK.includes(w)), 3, rnd).map(n => { const k = 1 + Math.floor(rnd() * 5); const opts = shuffle([k, ...pick([1, 2, 3, 4, 5].filter(x => x !== k), 2, rnd)], rnd); return { emoji: n[1], count: k, opts, answer: String(k) }; }) });
    S1.push({ type: 'oral', title: 'Say it!', help: 'wsH_oralWords', items: pick(easy, 6, rnd).map(([w, e]) => ({ emoji: e, answer: w })) });
  } else if (level === 2) {
    const m = pick(nouns, 6, rnd);
    S1.push({ type: 'match', title: 'Match the word to the picture.', help: 'wsH_match', words: m.map(x => x[0]), pics: shuffle(m, rnd).map(x => x[1]), items: m.map(([w, e]) => ({ answer: `${w} → ${e}` })) });
    S1.push({ type: 'countWrite', title: 'How many? Write the number.', help: 'wsH_countWrite', items: pick(nouns.filter(([w]) => EN_PLURAL_OK.includes(w)), 4, rnd).map(n => { const k = 2 + Math.floor(rnd() * 8); return { emoji: n[1], count: k, answer: String(k) }; }) });
    S1.push({ type: 'circleWord', title: 'Look and circle the word.', help: 'wsH_circleWord', items: pick(nouns, 4, rnd).map(target => ({ emoji: target[1], opts: shuffle([target[0], ...pick(nouns.filter(x => x !== target), 2, rnd).map(x => x[0])], rnd), answer: target[0] })) });
    S1.push({ type: 'colorBoxes', title: 'Color the boxes.', help: 'wsH_colorBoxes', items: pick(colors, 4, rnd).map(([w]) => ({ word: w, answer: w })) });
    S1.push({ type: 'oral', title: 'Say it!', help: 'wsH_oralWords', items: pick([...nouns, ...EN_WORDS.body], 6, rnd).map(([w, e]) => ({ emoji: e, answer: w })) });
  } else {
    S1.push({ type: 'write', title: 'Look and write.', help: 'wsH_write', items: pick(nouns.filter(([w]) => w.length <= 7), 6, rnd).map(([w, e]) => ({ emoji: e, hint: w[0] + ' ' + '_ '.repeat(w.length - 1).trim(), answer: w })) });
    S1.push({ type: 'numbers', title: 'Write the numbers in English.', help: 'wsH_numbers', items: pick([...Array(20)].map((_, i) => i + 1), 5, rnd).map(k => ({ n: k, answer: EN_NUMBERS[k] })) });
    S1.push({ type: 'unscramble', title: 'Unscramble the words.', help: 'wsH_unscramble', items: pick(nouns.filter(([w]) => w.length >= 3 && w.length <= 6), 4, rnd).map(([w, e]) => { let s = w; for (let i = 0; i < 5 && s === w; i++) s = shuffle(w.split(''), rnd).join(''); return { emoji: e, scrambled: s, answer: w }; }) });
    const frames = ['This is a ___.', 'I can see a ___.', 'I have a ___.', 'Look! A ___.'];
    S1.push({ type: 'complete', title: 'Complete the sentences.', help: 'wsH_complete', items: pick(nouns.filter(([w]) => !/^[aeiou]/.test(w)), 4, rnd).map(([w, e], i) => ({ emoji: e, sentence: frames[i % frames.length], answer: w })) });
    const draws = pick(EN_DRAW_OK, 2, rnd).map(([obj, cols], i) => i === 0 ? { text: `Draw a ${cols[Math.floor(rnd() * cols.length)]} ${obj}.`, answer: '✔' } : { text: `Draw ${EN_NUMBERS[2 + Math.floor(rnd() * 3)]} ${plural(obj)}.`, answer: '✔' });
    S1.push({ type: 'draw', title: 'Read and draw.', help: 'wsH_draw', items: draws });
    const q = ["What's your name?", 'How old are you?', "What's your favorite color?", 'Can you count to ten?', 'What animal do you like?', 'How are you today?'];
    S1.push({ type: 'talk', title: "Let's talk!", help: 'wsH_talk', items: pick(q, 4, rnd).map(x => ({ text: x, answer: '✔' })) });
  }
  const total = S1.reduce((s, sec) => s + sec.items.length, 0);
  return { level, seed, sections: S1, total };
}

   Impressão: relatório da semana (por criança e da família),
   quadro de tarefas para pendurar e provinha de inglês.

function printDocument(html, title) {
  let area = $('#printArea');
  if (!area) { area = document.createElement('div'); area.id = 'printArea'; document.body.appendChild(area); }
  area.innerHTML = html;
  const prevTitle = document.title; document.title = title || prevTitle;
  document.body.classList.add('print-mode');
  const done = () => { document.body.classList.remove('print-mode'); document.title = prevTitle; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  Modal.close('printModal');
  // Não desligar o modo de impressão por tempo: no iPhone a janela de impressão abre depois.
  // Na tela, o modo de impressão não muda nada; ele sai no "afterprint" ou na próxima impressão.
  setTimeout(() => window.print(), 60);
}

/* ---------- dados da semana ---------- */
function weekBounds(offset = 0) { const from = addDays(weekStart(), 7 * offset); return { from, to: addDays(from, 7) }; }
function inRange(iso, from, to) { const x = Date.parse(iso); return x >= from.getTime() && x < to.getTime(); }
function weekData(c, from, to) {
  const hist = S.history.filter(h => h.childId === c.id && inRange(h.date, from, to));
  const earned = hist.filter(h => h.points > 0 && h.type !== 'reward').reduce((s, h) => s + h.points, 0);
  const lost = -hist.filter(h => h.points < 0 && h.type !== 'reward').reduce((s, h) => s + h.points, 0);
  const spent = -hist.filter(h => h.type === 'reward').reduce((s, h) => s + h.points, 0);
  const tasks = hist.filter(h => h.type === 'task');
  const piggy = round2(S.piggyHistory.filter(p => p.childId === c.id && inRange(p.date, from, to)).reduce((s, p) => s + p.amount, 0));
  const english = S.english.sessions.filter(x => x.childId === c.id && inRange(x.date, from, to)).reduce((s, x) => s + x.minutes, 0);
  const hwList = S.homework.entries.filter(x => x.childId === c.id && inRange(x.date, from, to)), homework = hwList.reduce((s, x) => s + x.pages, 0);
  const medals = S.achievements.filter(a => a.childId === c.id && inRange(a.date, from, to)).map(a => ACHIEVEMENTS.find(x => x.code === a.code)).filter(Boolean);
  const days = [...Array(7)].map((_, i) => { const d = addDays(from, i), k = dayKey(d); const items = hist.filter(h => dayKey(h.date) === k); return { d, pages: hwList.filter(x => dayKey(x.date) === k).reduce((s, x) => s + x.pages, 0), tasks: items.filter(h => h.type === 'task'), pts: items.reduce((s, h) => s + (h.type === 'reward' ? 0 : h.points), 0) }; });
  const events = hist.filter(h => !['task', 'english', 'homework'].includes(h.type)).sort((a, b) => a.date.localeCompare(b.date));
  const test = S.english.tests.find(x => x.childId === c.id && inRange(x.date, from, to));
  // aproveitamento: tarefas fixas feitas / previstas até hoje (ou a semana toda, se já passou)
  const elapsed = Math.max(0, Math.min(7, Math.round((startOfDay(new Date()).getTime() - startOfDay(from).getTime()) / 864e5) + 1));
  const expected = elapsed ? expectedBetween(c, startOfDay(from), elapsed) : 0;
  const regular = tasks.filter(h => { const task = taskById(h.taskId); return task && task.frequency !== 'oneOff'; }).length;
  const rate = expected ? Math.min(100, Math.round(regular / expected * 100)) : 0;
  return { hist, earned, lost, spent, tasks, piggy, english, homework, medals, days, events, test, balance: earned - lost, expected, regular, rate };
}

/* ---------- pedaços comuns ---------- */
function weekLabel(from, to) {
  const o = { day: '2-digit', month: 'short' };
  return `${from.toLocaleDateString(locale(), o)} – ${addDays(to, -1).toLocaleDateString(locale(), { ...o, year: 'numeric' })}`;
}
function printAvatar(c) { return c.photo ? `<img class="pr-av" src="${esc(c.photo)}" alt="">` : `<span class="pr-av pr-emoji">${esc(c.avatar)}</span>`; }
function prBar(v, max) { const p = max > 0 ? Math.max(0, Math.min(100, Math.round(v / max * 100))) : 0; return `<span class="pr-bar"><i style="width:${p}%"></i></span>`; }
function prHeader(c, title, sub, right = '') {
  return `<div class="pr-hero" style="--c:${c.accentColor}">${printAvatar(c)}<div class="pr-hero-txt"><div class="pr-kicker">${esc(title)}</div><div class="pr-title">${esc(c.name)}</div><div class="pr-sub">${sub}</div></div>${right}</div>`;
}
/** Tarefas da criança que entram nas tabelas (fixas primeiro). */
function chartTasks(c) {
  const order = { daily: 0, weekly: 1, oneOff: 2 };
  return tasksForChild(c).slice().sort((a, b) => order[a.frequency] - order[b.frequency]);
}

/* ---------- grade tarefa × dia do relatório (✔ feita, ✗ faltou, riscado = não era dia) ---------- */
function reportRows(c, w) {
  const fixed = chartTasks(c).filter(x => x.frequency !== 'oneOff');
  const extraIds = [...new Set(w.tasks.map(h => String(h.taskId)))].filter(id => !fixed.some(x => String(x.id) === id));
  return [...fixed, ...extraIds.map(id => taskById(id) || { id, icon: '✅', name: (w.tasks.find(h => String(h.taskId) === id) || {}).description || t('taskRemoved'), frequency: 'oneOff', days: [] })];
}
function reportCell(task, d, weekDone) {
  const k = dayKey(d.d), today = dayKey(), n = d.tasks.filter(h => String(h.taskId) === String(task.id)).length;
  if (n) return `<td class="ok">✔${n > 1 ? `<small>×${n}</small>` : ''}</td>`;
  if (task.frequency === 'daily' && !scheduledOn(task, d.d)) return '<td class="off"></td>';
  if (task.frequency !== 'daily') return task.frequency === 'weekly' && !weekDone && k <= today && d.d.getDay() === 0 ? '<td class="miss">✗</td>' : '<td></td>';
  return k < today ? '<td class="miss">✗</td>' : '<td></td>';
}
function reportGridHtml(c, w, opts = {}) {
  const names = weekdayNames(true), days = w.days, rows = reportRows(c, w);
  if (!rows.length) return `<p class="pr-empty">${esc(t('noTasksForChild'))}</p>`;
  const showHw = w.homework > 0 || !!homeworkTaskFor(c);
  return `<table class="pr-grid ${opts.cls || ''}"><thead><tr><th class="pr-tl">${esc(opts.title || t('prTaskCol'))}</th>${days.map(d => `<th>${esc(names[d.d.getDay()])}<small>${d.d.getDate()}</small></th>`).join('')}${opts.total ? `<th>${esc(t('prTotalCol'))}</th>` : ''}</tr></thead>
    <tbody>${rows.map(task => { const done = w.tasks.filter(h => String(h.taskId) === String(task.id)).length; const weekDone = done > 0; return `<tr><td class="pr-tl"><span class="pr-ti">${esc(task.icon)}</span>${esc(task.nameKey || task.name ? taskName(task) : '')}${task.frequency === 'weekly' ? ` <small>(${esc(t('freqWeekly'))})</small>` : task.frequency === 'oneOff' ? ` <small>(${esc(t('freqOneOff'))})</small>` : ''}</td>${days.map(d => reportCell(task, d, weekDone)).join('')}${opts.total ? `<td class="pr-tot">${done}</td>` : ''}</tr>`; }).join('')}
      ${showHw ? `<tr class="pr-hw"><td class="pr-tl"><span class="pr-ti">📝</span>${esc(t('prHwRow'))}</td>${days.map(d => `<td>${d.pages ? d.pages : ''}</td>`).join('')}${opts.total ? `<td class="pr-tot">${w.homework}</td>` : ''}</tr>` : ''}
      <tr class="pr-sum"><td class="pr-tl">⭐ ${esc(t('prDayPoints'))}</td>${days.map(d => `<td>${d.pts ? (d.pts > 0 ? '+' : '') + d.pts : '·'}</td>`).join('')}${opts.total ? `<td class="pr-tot">${w.earned - w.lost}</td>` : ''}</tr></tbody></table>`;
}

/** Escolhe n itens espalhados de uma lista ordenada (do mais barato ao mais caro). */
function spreadPick(list, n) {
  if (list.length <= n) return list;
  return [...Array(n)].map((_, i) => list[Math.round(i * (list.length - 1) / (n - 1))]);
}
function taskChartHtml(c, from, to) {
  const names = weekdayNames(true), days = [...Array(7)].map((_, i) => addDays(from, i));
  const list = chartTasks(c), fixed = list.filter(x => x.frequency !== 'oneOff'), extra = list.filter(x => x.frequency === 'oneOff');
  const small = c.age <= 4;
  const rows = fixed.map(task => `<tr><td class="pr-tl"><span class="pr-ti">${esc(task.icon)}</span><span class="pr-tn">${esc(taskName(task))}${task.frequency === 'weekly' ? `<small>${esc(t('prOnceWeek'))}</small>` : task.time ? `<small>⏰ ${esc(task.time)}</small>` : ''}</span></td><td class="pts">+${task.points}</td>${days.map(d => task.frequency === 'daily' && !scheduledOn(task, d) ? '<td class="off"></td>' : '<td><span class="pr-cb"></span></td>').join('')}</tr>`).join('');
  const goal = englishGoal(c);
  const enRow = c.age >= 3 ? `<tr class="pr-en"><td class="pr-tl"><span class="pr-ti">🇬🇧</span><span class="pr-tn">${esc(t('prChartEnglish'))}<small>${esc(t('prChartEnglishGoal', { goal }))}</small></span></td><td class="pts">min</td>${days.map(() => '<td><span class="pr-write"></span></td>').join('')}</tr>` : '';
  const hwRow = c.age >= 5 ? `<tr class="pr-en"><td class="pr-tl"><span class="pr-ti">📝</span><span class="pr-tn">${esc(t('prChartHw'))}<small>${esc(t('prChartHwHint'))}</small></span></td><td class="pts">📄</td>${days.map(() => '<td><span class="pr-write"></span></td>').join('')}</tr>` : '';
  const rewards = spreadPick(S.rewards.slice().sort((a, b) => a.cost - b.cost), 8);
  // altura das linhas calculada para o quadro inteiro caber em uma folha A4
  const nRows = fixed.length + (hwRow ? 1 : 0) + (enRow ? 1 : 0);
  const extrasH = extra.length ? 34 + Math.ceil(extra.length / 3) * 20 : 0;
  const avail = 1039 - 110 - 36 - 22 - (rewards.length ? 34 + Math.ceil(rewards.length / 4) * 20 : 0) - extrasH - 34 - 48;
  const rowH = Math.max(20, Math.min(small ? 46 : 38, Math.floor(avail / Math.max(1, nRows))));
  const cb = Math.max(14, Math.min(small ? 28 : 22, rowH - 10));
  return `<div class="ps-page pr pr-chart ${small && rowH >= 34 ? 'pr-big' : ''} ${rowH < 28 ? 'pr-tight' : ''}" style="--c:${c.accentColor};--rowh:${rowH}px;--cb:${cb}px">
    ${prHeader(c, t('prChartKicker'), `${esc(t('prWeekOf'))} ${esc(weekLabel(from, to))}`, `<div class="pr-star"><b>⭐ ____</b><small>${esc(t('prChartTotal'))}</small></div>`)}
    ${fixed.length ? `<table class="pr-grid pr-chartgrid"><thead><tr><th class="pr-tl">${esc(t('prTaskCol'))}</th><th>⭐</th>${days.map(d => `<th>${esc(names[d.getDay()])}<small>${d.getDate()}</small></th>`).join('')}</tr></thead><tbody>${rows}${hwRow}${enRow}</tbody></table>` : `<p class="pr-empty">${esc(t('noTasksForChild'))}</p>`}
    <p class="pr-legend">${esc(t('prChartHow'))} · <span class="pr-off-sw"></span> ${esc(t('prLegOff'))}</p>
    ${extra.length ? `<div class="pr-box good"><h4>➕ ${esc(t('prChartExtras'))}</h4><div class="pr-extras">${extra.map(x => `<span>${esc(x.icon)} ${esc(taskName(x))} <b>+${x.points}</b> <i class="pr-tally"></i></span>`).join('')}</div></div>` : ''}
    ${rewards.length ? `<div class="pr-box rw"><h4>🎁 ${esc(t('prChartRewards'))}</h4><div class="pr-extras">${rewards.map(r => `<span>${esc(r.icon)} ${esc(rewardName(r))} <b>${r.cost} ⭐</b></span>`).join('')}</div></div>` : ''}
    <p class="pr-cheer">${esc(t('prChartCheer', { name: c.name }))}</p>
  </div>`;
}
/** Uma página com todas as tarefas da família e para quem é cada uma. */
function familyTasksHtml() {
  const kids = S.children, order = { daily: 0, weekly: 1, oneOff: 2 };

  // linhas mais baixas quando há muitas tarefas: a lista sempre cabe em uma folha A4

function qPickerHtml(cur) {

}
function quadroAll() {

  $('#qBody').innerHTML = `<div class="card q-card fw-screen" style="--c:#6c63ff">
    <div class="q-tools"><button type="button" class="btn btn-soft btn-sm" data-act="q-week" data-id="-1" aria-label="‹">←</button>${ui.qWeek ? `<button type="button" class="btn btn-soft btn-sm" data-act="q-week" data-id="0">${esc(t('prThisWeek'))}</button>` : ''}<button type="button" class="btn btn-soft btn-sm" data-act="q-week" data-id="1" aria-label="›">→</button>

function qChild() {
  const kid = activeChild(); if (kid) return kid;
  if (!childById(ui.qChild)) ui.qChild = S.children[0].id;
  return childById(ui.qChild);
}
/** Situação de uma tarefa num dia do quadro. */
function qCell(task, c, d, weekDone) {
  const k = dayKey(d), today = dayKey();
  const entry = S.history.find(h => h.type === 'task' && h.childId === c.id && String(h.taskId) === String(task.id) && dayKey(h.date) === k);
  if (entry) return { state: 'done', entry };
  const pend = S.approvals.find(a => a.status === 'pending' && a.kind === 'task' && a.childId === c.id && String(a.taskId) === String(task.id) && dayKey(a.submittedAt) === k);
  if (pend) return { state: 'pending' };
  if (task.frequency === 'daily' && !scheduledOn(task, d)) return { state: 'off' };
  if (task.frequency === 'weekly' && weekDone) return { state: 'rest' };
  if (k > today) return { state: 'future' };
  return { state: k === today ? 'today' : 'past' };
}
/** Pontos máximos que a criança pode ganhar numa semana com as tarefas fixas. */
function weeklyPotential(c, pointsOf = x => x.points) {
  return tasksForChild(c).reduce((s, x) => s + (x.frequency === 'daily' ? (x.days.length || 7) : x.frequency === 'weekly' ? 1 : 0) * pointsOf(x), 0);
}

const QUADRO_SECTION = {
  id: 'quadro', icon: '📋', nav: 'navChart', tab: 'tabChart', child: true,
  build: () => `<div id="qPicker"></div><div id="qBody"></div>`,
  update() {
    if (!isChildMode() && ui.qChild === 'all') return quadroAll();
    const c = qChild(), parent = !isChildMode();
    ui.qWeek = ui.qWeek || 0;
    const { from, to } = weekBounds(ui.qWeek), days = [...Array(7)].map((_, i) => addDays(from, i)), names = weekdayNames(true);
    $('#qPicker').innerHTML = parent ? qPickerHtml(c.id) : '';
    const list = chartTasks(c), fixed = list.filter(x => x.frequency !== 'oneOff'), extra = list.filter(x => x.frequency === 'oneOff');
    const w = weekData(c, from, to), today = dayKey();
    const row = task => {
      const weekDone = task.frequency === 'weekly' && S.history.some(h => h.type === 'task' && h.childId === c.id && String(h.taskId) === String(task.id) && inRange(h.date, from, to));
      const cells = days.map(d => {
        const s = qCell(task, c, d, weekDone), k = dayKey(d);
        if (s.state === 'done') return `<td class="q-ok">${parent ? `<button type="button" class="q-btn done" data-act="q-undo" data-id="${esc(s.entry.id)}" title="${esc(t('undo'))}">✔</button>` : '<span class="q-btn done">✔</span>'}</td>`;
        if (s.state === 'pending') return `<td><span class="q-btn wait" title="${esc(t('awaitingApproval'))}">⏳</span></td>`;
        if (s.state === 'off') return '<td class="q-off"></td>';
        if (s.state === 'rest') return '<td class="q-rest">·</td>';
        if (s.state === 'future') return '<td><span class="q-btn fut"></span></td>';
        if (s.state === 'today') return `<td class="q-today"><button type="button" class="q-btn open" data-act="q-mark" data-id="${esc(task.id)}" aria-label="${esc(t('markDone'))}"></button></td>`;
        return parent ? `<td><button type="button" class="q-btn past" data-act="q-mark-past" data-id="${esc(task.id)}" data-day="${k}" title="${esc(t('qMarkPast'))}">○</button></td>` : '<td><span class="q-btn miss">○</span></td>';
      }).join('');
      const ptsCell = parent ? `<td class="q-pts"><input type="number" min="1" max="999" inputmode="numeric" value="${task.points}" data-change="q-pts" data-id="${esc(task.id)}" aria-label="${esc(t('points'))}"></td>` : `<td class="q-pts"><b>+${task.points}</b></td>`;
      const sub = task.frequency === 'weekly' ? t('prOnceWeek') : task.days.length ? daysLabel(task) : (task.time ? '⏰ ' + task.time : '');
      return `<tr><th class="q-task" scope="row">${parent ? `<button type="button" class="q-name" data-act="task-edit" data-id="${esc(task.id)}" title="${esc(t('edit'))}">` : '<span class="q-name">'}<span class="q-ico">${esc(task.icon)}</span><span><b>${esc(taskName(task))}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</span>${parent ? ' <i class="q-pen">✏️</i></button>' : '</span>'}</th>${ptsCell}${cells}</tr>`;
    };
    const head = `<tr><th class="q-task">${esc(t('prTaskCol'))}</th><th>⭐</th>${days.map(d => `<th class="${dayKey(d) === today ? 'q-th-today' : ''}">${esc(names[d.getDay()])}<small>${d.getDate()}</small></th>`).join('')}</tr>`;
    const showHw = c.age >= 5 || w.homework > 0 || !!homeworkTaskFor(c);

function suggestedPoints(task) {

  const n = normName(taskName(task));

}

/* =====================================================================
   Jogos e raciocínio: mini-jogos no app (sudoku, memória, sequências),
   folhas de desafios para imprimir (com gabarito) e ideias de jogos de
   tabuleiro por idade, que viram tarefa ou recompensa.

/* ---------- nível pela idade ---------- */
function gameLevel(age) { return age < 3 ? 0 : age <= 4 ? 1 : age <= 6 ? 2 : age <= 9 ? 3 : 4; }
const G_FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉'];
const G_EMOJI = ['🐶', '🐱', '🐰', '🦊', '🐻', '🐼', '🐸', '🐵', '🦁', '🐯', '🐮', '🐷', '🐔', '🐙', '🦋', '🐢', '🚗', '⭐', '🌈', '🍦'];
function sudokuSpec(level) {
  return level <= 1 ? { n: 4, br: 2, bc: 2, holes: 5, syms: G_FRUITS.slice(0, 4) }
    : level === 2 ? { n: 4, br: 2, bc: 2, holes: 8, syms: ['1', '2', '3', '4'] }
    : level === 3 ? { n: 6, br: 2, bc: 3, holes: 16, syms: ['1', '2', '3', '4', '5', '6'] }
    : { n: 9, br: 3, bc: 3, holes: 38, syms: ['1', '2', '3', '4', '5', '6', '7', '8', '9'] };
}

/* ---------- sudoku: gera uma grade completa e tira números mantendo uma solução só ---------- */
function sudokuSolutions(g, n, br, bc, limit = 2) {
  const i = g.indexOf(-1); if (i < 0) return 1;
  const r = Math.floor(i / n), c = i % n; let count = 0;
  for (let v = 0; v < n && count < limit; v++) {
    let ok = true;
    for (let k = 0; k < n && ok; k++) if (g[r * n + k] === v || g[k * n + c] === v) ok = false;
    const r0 = r - r % br, c0 = c - c % bc;
    for (let a = 0; a < br && ok; a++) for (let b = 0; b < bc && ok; b++) if (g[(r0 + a) * n + c0 + b] === v) ok = false;
    if (ok) { g[i] = v; count += sudokuSolutions(g, n, br, bc, limit - count); g[i] = -1; }
  }
  return count;
}
function makeSudoku(level, rnd) {
  const { n, br, bc, holes, syms } = sudokuSpec(level);
  const bands = n / br, stacks = n / bc;
  const rows = shuffle([...Array(bands).keys()], rnd).flatMap(b => shuffle([...Array(br).keys()], rnd).map(x => b * br + x));
  const cols = shuffle([...Array(stacks).keys()], rnd).flatMap(s => shuffle([...Array(bc).keys()], rnd).map(x => s * bc + x));
  const sym = shuffle([...Array(n).keys()], rnd);
  const base = (r, c) => (bc * (r % br) + Math.floor(r / br) + c) % n;
  const solution = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) solution.push(sym[base(rows[r], cols[c])]);
  const puzzle = [...solution]; let removed = 0;
  for (const i of shuffle([...Array(n * n).keys()], rnd)) {
    if (removed >= holes) break;
    const keep = puzzle[i]; puzzle[i] = -1;
    if (sudokuSolutions([...puzzle], n, br, bc) === 1) removed++; else puzzle[i] = keep;
  }
  return { n, br, bc, syms, solution, puzzle };
}

/* ---------- sequências: "o que vem depois?" ---------- */
function makeSequence(level, rnd) {
  if (level <= 2 && (level <= 1 || rnd() < 0.5)) {
    const pats = level <= 1 ? ['AB', 'AAB', 'ABB'] : ['ABC', 'AABB', 'ABAC', 'ABB'];
    const pat = pats[Math.floor(rnd() * pats.length)], letters = [...new Set(pat)];
    const map = {}; pick(G_EMOJI, letters.length, rnd).forEach((e, i) => { map[letters[i]] = e; });
    const len = level <= 1 ? 5 : 6, seq = [...Array(len + 1)].map((_, i) => map[pat[i % pat.length]]);
    const answer = seq[len];
    const options = shuffle([answer, ...pick(G_EMOJI.filter(e => e !== answer && !Object.values(map).includes(e)), 1, rnd), ...Object.values(map).filter(e => e !== answer)].slice(0, 3), rnd);
    return { items: seq.slice(0, len), answer, options, emoji: true };
  }
  const kinds = level <= 2 ? ['+1', '+2', '-1'] : level === 3 ? ['+2', '+3', '+5', '-2', '+10', 'x2'] : ['+3', '+4', '+6', '-3', 'x2', '+n', '+9'];
  const k = kinds[Math.floor(rnd() * kinds.length)];
  let start = 1 + Math.floor(rnd() * (level <= 2 ? 5 : 12)); if (k.startsWith('-')) start += 10 * (level <= 2 ? 1 : 3);
  const seq = [start];
  for (let i = 1; i < 6; i++) {
    const p = seq[i - 1];
    seq.push(k === 'x2' ? p * 2 : k === '+n' ? p + i : p + Number(k));
  }
  if (k === 'x2') { seq.length = 0; let v = 1 + Math.floor(rnd() * 3); for (let i = 0; i < 6; i++) { seq.push(v); v *= 2; } }
  const answer = seq[5], items = seq.slice(0, 5);
  const options = shuffle([answer, answer + 1, answer - (k === 'x2' ? 2 : 1), answer + 2].filter((v, i, a) => a.indexOf(v) === i).slice(0, 3), rnd);
  return { items: items.map(String), answer: String(answer), options: options.map(String), emoji: false };
}
/* ---------- "qual é diferente?" ---------- */
function makeOddOne(rnd) {
  const [a, b] = pick(G_EMOJI, 2, rnd), pos = Math.floor(rnd() * 5);
  return { items: [...Array(5)].map((_, i) => i === pos ? b : a), answer: pos };
}
/* ---------- contas com quadradinho (7+) ---------- */
function makeMissing(level, rnd) {
  const max = level >= 4 ? 50 : 20, a = 1 + Math.floor(rnd() * max / 2), b = 1 + Math.floor(rnd() * max / 2), op = rnd() < 0.5 ? '+' : '−';
  if (op === '+') return rnd() < 0.5 ? { text: `□ + ${b} = ${a + b}`, answer: a } : { text: `${a} + □ = ${a + b}`, answer: b };
  const big = a + b; return rnd() < 0.5 ? { text: `${big} − □ = ${a}`, answer: b } : { text: `□ − ${b} = ${a}`, answer: big };
}
/* ---------- labirinto (desenhado em SVG) ---------- */
function makeMaze(w, h, rnd) {
  const walls = [...Array(w * h)].map(() => ({ n: 1, s: 1, e: 1, w: 1 })), seen = new Set([0]), stack = [0];
  while (stack.length) {
    const cur = stack[stack.length - 1], x = cur % w, y = Math.floor(cur / w);
    const nb = [[0, -1, 'n', 's'], [0, 1, 's', 'n'], [1, 0, 'e', 'w'], [-1, 0, 'w', 'e']]
      .map(([dx, dy, a, b]) => ({ nx: x + dx, ny: y + dy, a, b })).filter(o => o.nx >= 0 && o.ny >= 0 && o.nx < w && o.ny < h && !seen.has(o.ny * w + o.nx));
    if (!nb.length) { stack.pop(); continue; }
    const o = nb[Math.floor(rnd() * nb.length)], nxt = o.ny * w + o.nx;
    walls[cur][o.a] = 0; walls[nxt][o.b] = 0; seen.add(nxt); stack.push(nxt);
  }

  const prev = new Map([[0, -1]]), q = [0];
  while (q.length) { const c = q.shift(), x = c % w, y = Math.floor(c / w); [[0, -1, 'n'], [0, 1, 's'], [1, 0, 'e'], [-1, 0, 'w']].forEach(([dx, dy, d]) => { const n2 = (y + dy) * w + x + dx; if (!walls[c][d] && !prev.has(n2)) { prev.set(n2, c); q.push(n2); } }); }
  const path = []; for (let c = w * h - 1; c !== -1; c = prev.get(c)) path.unshift(c);
  return { w, h, walls, path };
}
function mazeSvg(m, withPath, size = 520) {
  const cs = Math.floor(size / Math.max(m.w, m.h)), W = cs * m.w, H = cs * m.h, sw = Math.max(2, Math.round(cs / 9));
  let lines = '';
  m.walls.forEach((c, i) => {
    const x = (i % m.w) * cs, y = Math.floor(i / m.w) * cs;
    if (c.n && i !== 0) lines += `M${x} ${y}h${cs}`; if (c.w) lines += `M${x} ${y}v${cs}`;
    if (c.s && i !== m.w * m.h - 1) lines += `M${x} ${y + cs}h${cs}`; if (c.e) lines += `M${x + cs} ${y}v${cs}`;
  });
  const pathD = withPath ? m.path.map((c, k) => `${k ? 'L' : 'M'}${(c % m.w) * cs + cs / 2} ${Math.floor(c / m.w) * cs + cs / 2}`).join('') : '';
  const fs = Math.round(cs * 0.62);
  return `<svg class="g-maze" viewBox="-4 -4 ${W + 8} ${H + 8}" width="${W + 8}" height="${H + 8}" xmlns="http://www.w3.org/2000/svg">
    ${withPath ? `<path d="${pathD}" fill="none" stroke="#ef4444" stroke-width="${Math.max(3, sw)}" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>` : ''}
    <path d="${lines}" stroke="#1d1d2b" stroke-width="${sw}" stroke-linecap="square" fill="none"/>
    <text x="${cs / 2}" y="${cs / 2 + fs / 3}" font-size="${fs}" text-anchor="middle">🐭</text>
    <text x="${W - cs / 2}" y="${H - cs / 2 + fs / 3}" font-size="${fs}" text-anchor="middle">🧀</text></svg>`;
}

/* ---------- folha de desafios para imprimir ---------- */

  }).join('')}</tr>`).join('')}</table>`;
}
function buildPuzzleSheet(c, seed) {
  const level = Math.max(1, gameLevel(c.age)), rnd = seededRng(seed), parts = [];
  const sud = [makeSudoku(level, rnd)]; if (level >= 2 && level <= 3) sud.push(makeSudoku(level, rnd));
  parts.push({ kind: 'sudoku', items: sud });
  const mz = level === 1 ? [5, 5] : level === 2 ? [8, 8] : level === 3 ? [12, 12] : [16, 16];
  parts.push({ kind: 'maze', item: makeMaze(mz[0], mz[1], rnd) });

  }
}

/* =====================================================================
   Jogos para dois (no mesmo aparelho) ou contra o computador:
   Jogo da velha, Lig 4 e Damas (regras simples, boas para crianças).
   Ganhar do computador vale estrelas (mesmo limite por dia dos desafios).
   ===================================================================== */

/* ---------- jogo da velha ---------- */
const TTT_LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
function tttWinner(b) { for (const [a, c, d] of TTT_LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return { p: b[a], line: [a, c, d] }; return b.every(Boolean) ? { p: 0 } : null; }
function tttCpu(b, skill) {
  const empty = b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  const tryFor = p => empty.find(i => { const x = [...b]; x[i] = p; const w = tttWinner(x); return w && w.p === p; });
  const win = tryFor(2); if (win !== undefined) return win;
  if (Math.random() < skill) { const block = tryFor(1); if (block !== undefined) return block; if (!b[4]) return 4; }
  return empty[Math.floor(Math.random() * empty.length)];
}

/* ---------- lig 4 (7 colunas × 6 linhas) ---------- */
const C4_W = 7, C4_H = 6;
function c4Drop(b, col, p) { for (let r = C4_H - 1; r >= 0; r--) if (!b[r * C4_W + col]) { const x = [...b]; x[r * C4_W + col] = p; return { b: x, i: r * C4_W + col }; } return null; }
function c4Winner(b) {
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let r = 0; r < C4_H; r++) for (let c = 0; c < C4_W; c++) {
    const p = b[r * C4_W + c]; if (!p) continue;
    for (const [dr, dc] of dirs) {
      const line = [0, 1, 2, 3].map(k => [r + dr * k, c + dc * k]);
      if (line.every(([rr, cc]) => rr >= 0 && rr < C4_H && cc >= 0 && cc < C4_W && b[rr * C4_W + cc] === p)) return { p, line: line.map(([rr, cc]) => rr * C4_W + cc) };
    }
  }
  return b.every(Boolean) ? { p: 0 } : null;
}
function c4Cpu(b, skill) {
  const cols = [...Array(C4_W).keys()].filter(c => !b[c]);
  const wins = p => cols.find(c => { const d = c4Drop(b, c, p); const w = d && c4Winner(d.b); return w && w.p === p; });
  const w = wins(2); if (w !== undefined) return w;
  if (Math.random() < skill) { const bl = wins(1); if (bl !== undefined) return bl; }
  // evita dar a vitória de presente e prefere o meio
  const safe = cols.filter(c => { const d = c4Drop(b, c, 2); if (!d) return false; const d2 = c4Drop(d.b, c, 1); const w2 = d2 && c4Winner(d2.b); return !(w2 && w2.p === 1); });
  const pool = (Math.random() < skill && safe.length ? safe : cols).sort((a, b2) => Math.abs(a - 3) - Math.abs(b2 - 3));
  return Math.random() < 0.6 ? pool[0] : pool[Math.floor(Math.random() * pool.length)];
}

/* ---------- damas (8×8; jogador 1 embaixo) ---------- */
function damInit() { const b = Array(64).fill(null); for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if ((r + c) % 2 === 1) { if (r < 3) b[r * 8 + c] = { p: 2, k: false }; if (r > 4) b[r * 8 + c] = { p: 1, k: false }; } return b; }
const DIAG = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
const inB = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
/** Capturas possíveis de uma peça: [{to, cap}] */
function damCaptures(b, i) {
  const pc = b[i]; if (!pc) return []; const r = Math.floor(i / 8), c = i % 8, out = [];
  DIAG.forEach(([dr, dc]) => {
    if (!pc.k) { const r1 = r + dr, c1 = c + dc, r2 = r + 2 * dr, c2 = c + 2 * dc; if (inB(r2, c2) && b[r1 * 8 + c1] && b[r1 * 8 + c1].p !== pc.p && !b[r2 * 8 + c2]) out.push({ to: r2 * 8 + c2, cap: r1 * 8 + c1 }); return; }
    let rr = r + dr, cc = c + dc; while (inB(rr, cc) && !b[rr * 8 + cc]) { rr += dr; cc += dc; }
    if (!inB(rr, cc) || b[rr * 8 + cc].p === pc.p) return;
    const cap = rr * 8 + cc; rr += dr; cc += dc;
    while (inB(rr, cc) && !b[rr * 8 + cc]) { out.push({ to: rr * 8 + cc, cap }); rr += dr; cc += dc; }
  });
  return out;
}
function damSteps(b, i) {
  const pc = b[i]; if (!pc) return []; const r = Math.floor(i / 8), c = i % 8, out = [];
  DIAG.forEach(([dr, dc]) => {
    if (!pc.k) { if (dr !== (pc.p === 1 ? -1 : 1)) return; const r1 = r + dr, c1 = c + dc; if (inB(r1, c1) && !b[r1 * 8 + c1]) out.push({ to: r1 * 8 + c1, cap: null }); return; }
    let rr = r + dr, cc = c + dc; while (inB(rr, cc) && !b[rr * 8 + cc]) { out.push({ to: rr * 8 + cc, cap: null }); rr += dr; cc += dc; }
  });
  return out;
}
function damMovesFor(g, i) { if (g.chain != null) return i === g.chain ? damCaptures(g.board, i) : []; return [...damCaptures(g.board, i), ...damSteps(g.board, i)]; }
function damAllMoves(g, p) { const out = []; g.board.forEach((pc, i) => { if (pc && pc.p === p) damMovesFor(g, i).forEach(m => out.push({ from: i, ...m })); }); return out; }
function damApply(g, from, m) {
  const b = g.board, pc = b[from]; b[m.to] = pc; b[from] = null; let more = false;
  if (m.cap != null) { b[m.cap] = null; more = damCaptures(b, m.to).length > 0; }
  if (more) { g.chain = m.to; g.sel = m.to; return; }
  const row = Math.floor(m.to / 8); if ((pc.p === 1 && row === 0) || (pc.p === 2 && row === 7)) pc.k = true;
  g.chain = null; g.sel = null; g.turn = g.turn === 1 ? 2 : 1;
  const left = b.filter(x => x && x.p === g.turn).length;
  if (!left || !damAllMoves(g, g.turn).length) g.winner = { p: g.turn === 1 ? 2 : 1 };
}
function damCpuMove(g) {
  const moves = damAllMoves(g, 2); if (!moves.length) return;
  const caps = moves.filter(m => m.cap != null);
  let pool = caps.length && Math.random() < g.skill + 0.3 ? caps : moves;
  if (Math.random() < g.skill) { // evita deixar peça para ser comida
    const safe = pool.filter(m => { const x = { ...g, board: g.board.map(p => p && { ...p }), chain: null }; x.board[m.to] = x.board[m.from]; x.board[m.from] = null; if (m.cap != null) x.board[m.cap] = null; return !damAllMoves({ ...x, chain: null }, 1).some(mm => mm.cap === m.to); });
    if (safe.length) pool = safe;
  }
  const m = pool[Math.floor(Math.random() * pool.length)]; damApply(g, m.from, m);
}

/* ---------- ligar aos jogos do app ---------- */
function cpuSkill(age) { return age <= 4 ? 0.25 : age <= 6 ? 0.5 : age <= 9 ? 0.75 : 0.9; }
function startDuel(type, mode) {
  const c = gChild(); mode = mode || (ui.g && ui.g.type === type ? ui.g.mode : 'cpu');
  const base = { type, mode, childId: c.id, level: gameLevel(c.age), turn: 1, winner: null, done: false, skill: cpuSkill(c.age), busy: false };
  if (type === 'ttt') ui.g = { ...base, board: Array(9).fill(0) };
  if (type === 'c4') ui.g = { ...base, board: Array(C4_W * C4_H).fill(0), last: null };
  if (type === 'dam') ui.g = { ...base, board: damInit(), sel: null, chain: null };
  renderGameBoard();
}
function duelEnd() {
  const g = ui.g; if (!g.winner || g.done) return; g.done = true;
  const c = childById(g.childId);
  if (g.mode === 'cpu' && g.winner.p === 1 && c) { const w = recordWin(c, g.type, g.level); commit(); g.result = w.points ? t('gWinStars', { n: w.points }) : t('gWinNoStars'); }
  renderGameBoard();
}
function cpuTurn() {
  const g = ui.g; if (!g || g.mode !== 'cpu' || g.turn !== 2 || g.winner) return;
  g.busy = true; renderGameBoard();
  setTimeout(() => {
    if (ui.g !== g) return;
    if (g.type === 'ttt') { g.board[tttCpu(g.board, g.skill)] = 2; g.winner = tttWinner(g.board); g.turn = 1; }
    if (g.type === 'c4') { const d = c4Drop(g.board, c4Cpu(g.board, g.skill), 2); if (d) { g.board = d.b; g.last = d.i; } g.winner = c4Winner(g.board); g.turn = 1; }
    if (g.type === 'dam') { do { damCpuMove(g); } while (g.chain != null && !g.winner); }
    g.busy = false;
    if (g.winner) return duelEnd();
    renderGameBoard();
  }, g.type === 'dam' ? 650 : 450);
}
function duelHtml(g) {
  const c = childById(g.childId), me = c ? c.name : t('gPlayer1'), other = g.mode === 'cpu' ? '🤖 ' + t('gCpu') : t('gPlayer2');
  const marks = { ttt: ['❌', '⭕'], c4: ['🔴', '🟡'], dam: ['⚪', '⚫'] }[g.type];
  const modeBtns = `<div class="g-modes"><button type="button" class="chip ${g.mode === 'cpu' ? 'on' : ''}" data-act="g-duel-mode" data-id="cpu">🤖 ${t('gVsCpu')}</button><button type="button" class="chip ${g.mode === '2p' ? 'on' : ''}" data-act="g-duel-mode" data-id="2p">👫 ${t('gTwoPlayers')}</button></div>`;
  const status = g.winner ? (g.winner.p === 0 ? '🤝 ' + t('gDraw') : `🏆 ${t('gWinner', { name: g.winner.p === 1 ? me : other })}`) : g.busy ? '🤖 ' + t('gCpuThinking') : `${marks[g.turn - 1]} ${t('gTurnOf', { name: g.turn === 1 ? me : other })}`;
  const players = `<div class="g-players"><span class="${g.turn === 1 && !g.winner ? 'on' : ''}">${marks[0]} ${esc(me)}</span><b>×</b><span class="${g.turn === 2 && !g.winner ? 'on' : ''}">${marks[1]} ${esc(other)}</span></div>`;
  let board = '';
  const line = g.winner && g.winner.line ? g.winner.line : [];
  if (g.type === 'ttt') board = `<div class="g-ttt">${g.board.map((v, i) => `<button type="button" class="g-tcell ${line.includes(i) ? 'win' : ''}" data-act="g-ttt" data-id="${i}" ${v || g.winner || g.busy ? 'disabled' : ''}>${v ? marks[v - 1] : ''}</button>`).join('')}</div>`;
  if (g.type === 'c4') board = `<div class="g-c4"><div class="g-c4-cols">${[...Array(C4_W).keys()].map(cc => `<button type="button" class="g-c4-drop" data-act="g-c4" data-id="${cc}" ${g.board[cc] || g.winner || g.busy ? 'disabled' : ''}>⬇</button>`).join('')}</div><div class="g-c4-grid">${g.board.map((v, i) => `<span class="g-c4-cell ${v ? 'p' + v : ''} ${line.includes(i) ? 'win' : ''} ${g.last === i ? 'last' : ''}"></span>`).join('')}</div></div>`;
  if (g.type === 'dam') {
    const targets = g.sel != null ? damMovesFor(g, g.sel).map(m => m.to) : [];
    const movable = new Set(g.winner || g.busy ? [] : damAllMoves(g, g.turn).map(m => m.from));
    board = `<div class="g-dam">${g.board.map((pc, i) => { const dark = (Math.floor(i / 8) + i % 8) % 2 === 1; const tgt = targets.includes(i); return `<button type="button" class="g-dcell ${dark ? 'dark' : ''} ${g.sel === i ? 'sel' : ''} ${tgt ? 'tgt' : ''} ${movable.has(i) && pc && pc.p === g.turn ? 'can' : ''}" data-act="g-dam" data-id="${i}" ${dark && !g.winner && !g.busy ? '' : 'disabled'}>${pc ? `<span class="g-piece p${pc.p} ${pc.k ? 'king' : ''}">${pc.k ? '👑' : ''}</span>` : tgt ? '<i></i>' : ''}</button>`; }).join('')}</div>
      <p class="hint">${t(g.chain != null ? 'gDamChain' : 'gDamHelp')}</p>`;
  }
  const close = `<button type="button" class="btn btn-ghost btn-sm" data-act="g-quit">✕ ${t('close')}</button>`;
  const after = g.winner ? `<div class="g-done">${status}${g.result ? ` · ${esc(g.result)}` : ''}<div class="actions"><button type="button" class="btn btn-primary" data-act="g-duel" data-id="${g.type}">🔄 ${t('gAgain')}</button>${close}</div></div>` : '';
  return `<div class="g-board"><div class="g-board-head"><b>${{ ttt: '❌⭕ ', c4: '🔴🟡 ', dam: '⚫⚪ ' }[g.type]}${t('g_' + g.type)}</b><span class="hint">${esc(t('gDesc_' + g.type))}</span>${close}</div>
    ${modeBtns}${players}<p class="g-status">${status}</p>${board}${after}</div>`;
}
// o quadro de jogo já existente passa a saber desenhar os jogos de dois
const _renderGameBoardBase = renderGameBoard;
renderGameBoard = function () {
  const g = ui.g, el = $('#gBoard');
  if (el && g && ['ttt', 'c4', 'dam'].includes(g.type)) { el.innerHTML = duelHtml(g); return; }
  _renderGameBoardBase();
};

Object.assign(ACTIONS, {
  'g-duel': el => startDuel(el.dataset.id),
  'g-duel-mode': el => { if (ui.g) startDuel(ui.g.type, el.dataset.id); },
  'g-ttt': el => {
    const g = ui.g; if (!g || g.winner || g.busy) return; const i = int(el.dataset.id, 0); if (g.board[i]) return;
    g.board[i] = g.turn; g.winner = tttWinner(g.board); g.turn = g.turn === 1 ? 2 : 1;
    if (g.winner) return duelEnd(); renderGameBoard(); cpuTurn();
  },
  'g-c4': el => {
    const g = ui.g; if (!g || g.winner || g.busy) return; const d = c4Drop(g.board, int(el.dataset.id, 0), g.turn); if (!d) return;
    g.board = d.b; g.last = d.i; g.winner = c4Winner(g.board); g.turn = g.turn === 1 ? 2 : 1;
    if (g.winner) return duelEnd(); renderGameBoard(); cpuTurn();
  },
  'g-dam': el => {
    const g = ui.g; if (!g || g.winner || g.busy) return; const i = int(el.dataset.id, 0), pc = g.board[i];
    if (g.mode === 'cpu' && g.turn === 2) return;
    if (g.sel != null) { const m = damMovesFor(g, g.sel).find(x => x.to === i); if (m) { damApply(g, g.sel, m); if (g.winner) return duelEnd(); renderGameBoard(); if (g.chain == null) cpuTurn(); return; } }
    if (g.chain != null) return; // no meio de uma sequência de capturas
    if (pc && pc.p === g.turn && damMovesFor(g, i).length) { g.sel = i; renderGameBoard(); }
  }
});

// no celular o tabuleiro fica abaixo dos botões: ao começar um jogo, rola até ele
['g-start', 'g-duel'].forEach(k => {
  const base = ACTIONS[k];
  ACTIONS[k] = el => { base(el); const b = $('#gBoard'); if (b && b.scrollIntoView) setTimeout(() => b.scrollIntoView({ behavior: 'smooth', block: 'start' }), 30); };
});

</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load', () => {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const check = () => reg.update().catch(() => {});
    setInterval(check, 30 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  }).catch(() => {});
  let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || done) return; done = true; if (window.__onAppUpdate) window.__onAppUpdate(); else location.reload(); });
});
</script>
</body>
</html>
