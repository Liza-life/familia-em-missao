/* ---------- leitura de valores antigos ---------- */
const DAY_ALIASES = {
  0: ['dom', 'domingo', 'sun', 'sunday', 'do'], 1: ['seg', 'segunda', 'mon', 'monday', 'lun', 'lunes', 'se'],
  2: ['ter', 'terca', 'tue', 'tuesday', 'mar', 'martes', 'te'], 3: ['qua', 'quarta', 'wed', 'wednesday', 'mie', 'miercoles', 'qa'],
  4: ['qui', 'quinta', 'thu', 'thursday', 'jue', 'jueves', 'qi'], 5: ['sex', 'sexta', 'fri', 'friday', 'vie', 'viernes', 'sx'],
  6: ['sab', 'sabado', 'sat', 'saturday', 'sa']
};
function parseDays(v) {
  if (Array.isArray(v)) return [...new Set(v.map(Number).filter(n => n >= 0 && n <= 6))].sort();
  const s = String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  if (!s.trim() || /todos|every|all|diar/.test(s)) return [];
  const parts = s.split(/[^a-z]+/).filter(Boolean);
  const out = new Set();
  parts.forEach(p => Object.entries(DAY_ALIASES).forEach(([d, list]) => { if (list.some(a => p === a || (a.length >= 3 && p.startsWith(a)))) out.add(Number(d)); }));
  return out.size === 7 ? [] : [...out].sort();
}
function legacyFrequency(t) {
  if (FREQS.includes(t.frequency)) return t.frequency;
  if (FREQS.includes(t.frequencyKey)) return t.frequencyKey;
  const s = String(t.frequency || '').toLowerCase();
  if (/seman|week/.test(s)) return 'weekly';
  if (/avuls|one|única|unica/.test(s)) return 'oneOff';
  return 'daily';
}
function parseLegacyValue(value) {
  // ex.: "+10 pts / +R$ 1,00" ou "-5 pts / -R$ 0,50"
  const s = String(value || '');
  const pm = s.match(/([+-]?)\s*(\d+)\s*pts?/i);
  const points = pm ? (pm[1] === '-' ? -1 : 1) * Number(pm[2]) : 0;
  const mm = s.match(/([+-]?)\s*R\$\s*([\d.]*\d(?:,\d+)?)/);
  let cash = 0;
  if (mm) { cash = Number(mm[2].replace(/\./g, '').replace(',', '.')) || 0; if (mm[1] === '-' || /\/\s*-/.test(s)) cash = -cash; }
  return { points, cash };
}

/* ---------- normalização (aceita dados da v70 e de versões antigas) ---------- */
function normalize(raw, defaultKeys) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.children)) throw new Error('invalid');
  const d = initialData();
  d.familyName = text(raw.familyName, 60) || d.familyName;
  d.defaultGoal = Math.max(1, int(raw.defaultGoal, 200));
  d.defaultPointValue = Math.max(0, round2(num(raw.defaultPointValue, 0.10)));
  d.language = ['pt', 'en', 'es', 'it', 'zh', 'zht'].includes(raw.language) ? raw.language : 'pt';
  d.pinHash = typeof raw.pinHash === 'string' && raw.pinHash.startsWith('h1:') ? raw.pinHash
    : hashPin(String(raw.pin ?? '').trim() || DEFAULT_PIN);
  d.onboardingComplete = raw.onboardingComplete !== undefined ? !!raw.onboardingComplete : true;
  d.updatedAt = safeIso(raw.updatedAt);
  if (raw.migratedFrom) d.migratedFrom = text(raw.migratedFrom, 20);

  const idMap = new Map(), used = new Set();
  d.children = raw.children.filter(c => c && typeof c === 'object' && text(c.name, 40)).map((c, i) => {
    let id = cleanId(c.id) || `child-${i}`;
    while (used.has(id)) id += `-${i}`;
    used.add(id); idMap.set(String(c.id), id);
    const accent = HEX.test(c.accentColor) ? c.accentColor : HEX.test(c.color) ? c.color : PROFILE_COLORS[i % PROFILE_COLORS.length];
    return {
      id, name: text(c.name, 40), age: clamp(int(c.age, 0), 0, 30), avatar: text(c.avatar || '🙂', 8) || '🙂',
      photo: typeof c.photo === 'string' && c.photo.startsWith('data:image/') ? c.photo : '',
      accentColor: accent, progressColor: HEX.test(c.progressColor) ? c.progressColor : accent,
      points: Math.max(0, int(c.points, 0)), goal: Math.max(1, int(c.goal, d.defaultGoal)),
      piggy: Math.max(0, round2(num(c.piggy, 0))), xp: Math.max(0, int(c.xp, 0))
    };
  });
  if (!d.children.length) throw new Error('no children');
  const mapChild = id => idMap.get(String(id));

  const taskIds = new Set();
  d.tasks = (Array.isArray(raw.tasks) ? raw.tasks : []).filter(t => t && typeof t === 'object').map((t, i) => {
    let id = Number(t.id) || Date.now() + i; while (taskIds.has(id)) id++; taskIds.add(id);
    const name = text(t.name, 80);
    let nameKey = typeof t.nameKey === 'string' && defaultKeys.has(t.nameKey) ? t.nameKey : null;
    if (!nameKey && DEFAULT_TASK_KEYS[id] && name && name === defaultKeys.ptName(DEFAULT_TASK_KEYS[id])) nameKey = DEFAULT_TASK_KEYS[id];
    const childIds = Array.isArray(t.childIds) ? [...new Set(t.childIds.map(mapChild).filter(Boolean))] : [];
    return {
      id, name: name || (nameKey ? defaultKeys.ptName(nameKey) : ''), nameKey,
      points: Math.max(1, int(t.points, 10)), icon: text(t.icon || '✅', 8) || '✅', frequency: legacyFrequency(t),
      days: parseDays(t.days), time: /^\d{2}:\d{2}$/.test(t.time || '') ? t.time : '',
      approvalRequired: t.approvalRequired === undefined ? false : !!t.approvalRequired, childIds,
      cashPerPoint: t.cashPerPoint === null || t.cashPerPoint === undefined || t.cashPerPoint === '' ? null : Math.max(0, round2(num(t.cashPerPoint))),
      fixedCash: Math.max(0, round2(num(t.fixedCash, 0)))
    };
  }).filter(t => t.name || t.nameKey);

  const rewardIds = new Set();
  d.rewards = (Array.isArray(raw.rewards) ? raw.rewards : []).filter(r => r && typeof r === 'object').map((r, i) => {
    let id = Number(r.id) || Date.now() + i; while (rewardIds.has(id)) id++; rewardIds.add(id);
    const name = text(r.name, 80);
    let nameKey = typeof r.nameKey === 'string' && defaultKeys.has(r.nameKey) ? r.nameKey : null;
    if (!nameKey && DEFAULT_REWARD_KEYS[id] && name && name === defaultKeys.ptName(DEFAULT_REWARD_KEYS[id])) nameKey = DEFAULT_REWARD_KEYS[id];
    return { id, name: name || (nameKey ? defaultKeys.ptName(nameKey) : ''), nameKey, cost: Math.max(1, int(r.cost, 50)), icon: text(r.icon || '🎁', 8) || '🎁' };
  }).filter(r => r.name || r.nameKey);

  d.history = (Array.isArray(raw.history) ? raw.history : []).map((h, i) => {
    if (!h || typeof h !== 'object') return null;
    const childId = mapChild(h.childId); if (!childId) return null;
    const legacy = parseLegacyValue(h.value);
    const type = ['task', 'reward', 'adjust', 'behavior', 'english', 'homework', 'game'].includes(h.type) ? h.type : 'adjust';
    let points = Number.isFinite(h.points) ? h.points : Number.isFinite(h.pointsEarned) ? h.pointsEarned : legacy.points;
    let cash = Number.isFinite(h.cash) ? h.cash : Number.isFinite(h.cashEarned) ? h.cashEarned : legacy.cash;
    if (type === 'reward' && points > 0) points = -points;
    return {
      id: cleanId(h.id) || `h${i}x${Date.parse(h.date) || 0}`, date: safeIso(h.date), type, childId,
      childName: text(h.childName, 40), taskId: h.taskId != null && h.taskId !== '' ? Number(h.taskId) : null,
      rewardId: h.rewardId != null && h.rewardId !== '' ? Number(h.rewardId) : null,
      note: text(h.note, 200), description: text(h.description, 200), points: Math.round(points), cash: round2(cash),
      approvalId: h.approvalId ? cleanId(h.approvalId) : null,
      minutes: type === 'english' ? clamp(int(h.minutes, 0), 0, 600) : undefined, activity: type === 'english' ? text(h.activity, 30) : undefined,
      pages: type === 'homework' ? clamp(int(h.pages, 0), 0, 200) : undefined, subject: type === 'homework' ? text(h.subject, 30) : undefined,
      game: type === 'game' ? text(h.game, 20) : undefined, level: type === 'game' ? clamp(int(h.level, 1), 0, 4) : undefined
    };
  }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date));
  // versões antigas guardavam a observação dentro da descrição ("Tarefa — observação")
  d.history.forEach(h => { if (h.type === 'task' && !h.note && h.description.includes(' — ')) { const i = h.description.indexOf(' — '); h.note = h.description.slice(i + 3); h.description = h.description.slice(0, i); } });

  d.piggyHistory = (Array.isArray(raw.piggyHistory) ? raw.piggyHistory : []).map((p, i) => {
    if (!p || typeof p !== 'object') return null;
    const childId = mapChild(p.childId); if (!childId) return null;
    return { id: cleanId(p.id) || `p${i}x${Date.parse(p.date) || 0}`, date: safeIso(p.date), childId, amount: round2(num(p.amount)),
      note: text(p.note, 120), source: ['manual', 'task', 'behavior'].includes(p.source) ? p.source : 'manual', historyId: p.historyId ? cleanId(p.historyId) : null };
  }).filter(p => p && p.amount).sort((a, b) => b.date.localeCompare(a.date));

  const rawApprovals = Array.isArray(raw.approvals) ? raw.approvals : Array.isArray(raw.pendingApprovals) ? raw.pendingApprovals : [];
  d.approvals = rawApprovals.map((a, i) => {
    if (!a || typeof a !== 'object') return null;
    const childId = mapChild(a.childId); if (!childId) return null;
    const status = ['pending', 'approved', 'rejected', 'reverted'].includes(a.status) ? a.status : 'pending';
    return {
      id: cleanId(a.id) || `a${i}`, kind: ['reward', 'english', 'homework'].includes(a.kind) ? a.kind : 'task', childId,
      pages: a.kind === 'homework' ? clamp(int(a.pages, 0), 0, 200) : undefined, subject: a.kind === 'homework' ? text(a.subject, 30) : undefined,
      minutes: a.kind === 'english' ? clamp(int(a.minutes, 0), 0, 600) : undefined, activity: a.kind === 'english' ? text(a.activity, 30) : undefined,
      studyDate: ['english', 'homework'].includes(a.kind) ? safeIso(a.studyDate || a.submittedAt) : undefined,
      taskId: a.taskId != null ? Number(a.taskId) : null, rewardId: a.rewardId != null ? Number(a.rewardId) : null,
      label: text(a.label || a.taskName || a.rewardName, 120), points: int(a.points, 0), note: text(a.note, 200), status,
      submittedAt: safeIso(a.submittedAt || a.date), reviewedAt: a.reviewedAt ? safeIso(a.reviewedAt) : null,
      reason: text(a.reason || a.rejectionReason, 200), historyId: a.historyId ? cleanId(a.historyId) : null
    };
  }).filter(Boolean).sort((a, b) => b.submittedAt.localeCompare(a.submittedAt));

  d.goals = (Array.isArray(raw.goals) ? raw.goals : Array.isArray(raw.savingsGoals) ? raw.savingsGoals : []).map((g, i) => {
    if (!g || typeof g !== 'object') return null;
    const childId = mapChild(g.childId); if (!childId || !text(g.name, 60)) return null;
    return { id: cleanId(g.id) || `g${i}`, childId, name: text(g.name, 60), target: Math.max(0.01, round2(num(g.target, 0))), createdAt: safeIso(g.createdAt) };
  }).filter(Boolean);

  d.achievements = (Array.isArray(raw.achievements) ? raw.achievements : []).map((a, i) => {
    if (!a || typeof a !== 'object') return null;
    const childId = mapChild(a.childId); const code = a.code || a.id;
    if (!childId || !ACHIEVEMENTS.some(x => x.code === code)) return null;
    return { id: `ac${i}${childId}`, code, childId, date: safeIso(a.date) };
  }).filter(Boolean).filter((a, i, arr) => arr.findIndex(b => b.code === a.code && b.childId === a.childId) === i);

  d.behaviorNotes = (Array.isArray(raw.behaviorNotes) ? raw.behaviorNotes : []).map((n, i) => {
    if (!n || typeof n !== 'object') return null;
    const childId = mapChild(n.childId); if (!childId) return null;
    return { id: cleanId(n.id) || `b${i}`, date: safeIso(n.date), childId, type: n.type === 'positive' ? 'positive' : 'negative',
      text: text(n.text, 300), points: Math.max(0, int(n.points, 0)), cash: Math.max(0, round2(num(n.cash ?? n.money, 0))), historyId: n.historyId ? cleanId(n.historyId) : null };
  }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date));

  const notes = [...(Array.isArray(raw.privateNotes) ? raw.privateNotes : []), ...(Array.isArray(raw.privateChildNotes) ? raw.privateChildNotes : [])];
  const seen = new Set();
  d.privateNotes = notes.map((n, i) => {
    if (!n || typeof n !== 'object') return null;
    const childId = mapChild(n.childId); const id = cleanId(n.id) || `n${i}`;
    if (!childId || !text(n.text, 2000) || seen.has(id)) return null; seen.add(id);
    return { id, childId, text: text(n.text, 2000), createdAt: safeIso(n.createdAt || n.date), read: !!n.read };
  }).filter(Boolean).sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  const acc = raw.familyAccount && typeof raw.familyAccount === 'object' ? raw.familyAccount : {};
  d.familyAccount = { email: text(acc.email, 120), passwordHash: typeof acc.passwordHash === 'string' ? acc.passwordHash.slice(0, 80) : '' };

  // inglês: tempo de estudo e provinhas
  const en = raw.english && typeof raw.english === 'object' ? raw.english : {};
  const es = en.settings && typeof en.settings === 'object' ? en.settings : {};
  const goals = {};
  if (es.goals && typeof es.goals === 'object') Object.entries(es.goals).forEach(([k, v]) => { const id = mapChild(k); if (id && int(v, -1) >= 0) goals[id] = clamp(int(v, 0), 0, 3000); });
  d.english = {
    settings: { pointsPer15: clamp(int(es.pointsPer15, 5), 0, 100), testDay: clamp(int(es.testDay, 25), 1, 28), goals },
    sessions: (Array.isArray(en.sessions) ? en.sessions : []).map((x, i) => {
      if (!x || typeof x !== 'object') return null; const childId = mapChild(x.childId); const minutes = clamp(int(x.minutes, 0), 0, 600);
      if (!childId || !minutes) return null;
      return { id: cleanId(x.id) || `es${i}`, childId, date: safeIso(x.date), minutes, activity: text(x.activity, 30) || 'other', note: text(x.note, 200), historyId: x.historyId ? cleanId(x.historyId) : null };
    }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date)),
    tests: (Array.isArray(en.tests) ? en.tests : []).map((x, i) => {
      if (!x || typeof x !== 'object') return null; const childId = mapChild(x.childId); if (!childId) return null;
      const total = clamp(int(x.total, 0), 0, 200);
      return { id: cleanId(x.id) || `et${i}`, childId, date: safeIso(x.date), level: clamp(int(x.level, 1), 1, 3), score: clamp(int(x.score, 0), 0, total || 200), total,
        cando: Array.isArray(x.cando) ? [...new Set(x.cando.map(v => cleanId(v)).filter(Boolean))].slice(0, 30) : [], note: text(x.note, 300) };
    }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date))
  };
  // lição de casa: páginas feitas
  const hw = raw.homework && typeof raw.homework === 'object' ? raw.homework : {};
  const hs = hw.settings && typeof hw.settings === 'object' ? hw.settings : {};
  d.homework = {
    settings: { pointsPerPage: clamp(int(hs.pointsPerPage, 2), 0, 100), autoTask: hs.autoTask !== false },
    entries: (Array.isArray(hw.entries) ? hw.entries : []).map((x, i) => {
      if (!x || typeof x !== 'object') return null; const childId = mapChild(x.childId); const pages = clamp(int(x.pages, 0), 0, 200);
      if (!childId || !pages) return null;
      return { id: cleanId(x.id) || `hw${i}`, childId, date: safeIso(x.date), pages, subject: text(x.subject, 30) || 'other', note: text(x.note, 200), historyId: x.historyId ? cleanId(x.historyId) : null, taskHistoryId: x.taskHistoryId ? cleanId(x.taskHistoryId) : null };
    }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date))
  };

  // jogos de raciocínio: vitórias que deram estrelas
  const gm = raw.games && typeof raw.games === 'object' ? raw.games : {};
  const gs = gm.settings && typeof gm.settings === 'object' ? gm.settings : {};
  d.games = {
    settings: { pointsPerWin: clamp(int(gs.pointsPerWin, 5), 0, 100), maxPerDay: clamp(int(gs.maxPerDay, 3), 0, 20) },
    wins: (Array.isArray(gm.wins) ? gm.wins : []).map((x, i) => {
      if (!x || typeof x !== 'object') return null; const childId = mapChild(x.childId); if (!childId) return null;
      return { id: cleanId(x.id) || `gw${i}`, childId, date: safeIso(x.date), game: text(x.game, 20), level: clamp(int(x.level, 1), 0, 4), points: clamp(int(x.points, 0), 0, 100), historyId: x.historyId ? cleanId(x.historyId) : null };
    }).filter(Boolean).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 2000),
    lastSheets: {}
  };
  if (gm.lastSheets && typeof gm.lastSheets === 'object') Object.entries(gm.lastSheets).forEach(([k, v]) => { const id = mapChild(k); if (id && v && typeof v.seed === 'string') d.games.lastSheets[id] = { seed: v.seed.slice(0, 80), date: safeIso(v.date) }; });

  // novidades já colocadas uma vez (para não voltarem se forem apagadas)
  d.seeded = Array.isArray(raw.seeded) ? [...new Set(raw.seeded.filter(x => typeof x === 'string').map(x => x.slice(0, 40)))].slice(0, 100) : [];

  // modo atual
  const m = raw.mode && typeof raw.mode === 'object' ? raw.mode : { current: raw.currentMode, childId: raw.activeChildId };
  const modeChild = mapChild(m.childId) || d.children[0].id;
  d.mode = { current: m.current === 'child' && mapChild(m.childId) ? 'child' : 'parent', childId: modeChild };

  // tema
  const th = raw.theme;
  if (th && typeof th === 'object') {
    d.theme = { name: PRESET_THEMES[th.name] || th.name === 'custom' || th.name === 'child' ? th.name : 'purple', custom: null, childId: mapChild(th.childId) || null };
    if (th.custom && ['sidebar1', 'sidebar2', 'btn1', 'btn2'].every(k => HEX.test(th.custom[k]))) d.theme.custom = { ...th.custom };
  } else {
    const ct = raw.customTheme || {};
    if (th === 'custom' && ['sidebar1', 'sidebar2', 'quick1', 'quick2'].every(k => HEX.test(ct[k])))
      d.theme = { name: 'custom', custom: { sidebar1: ct.sidebar1, sidebar2: ct.sidebar2, btn1: ct.quick1, btn2: ct.quick2 }, childId: null };
    else if (th === 'child' && mapChild(ct.childId)) d.theme = { name: 'child', custom: null, childId: mapChild(ct.childId) };
    else d.theme = { name: PRESET_THEMES[th] ? th : 'purple', custom: null, childId: null };
  }
  if (d.theme.name === 'custom' && !d.theme.custom) d.theme.name = 'purple';
  if (d.theme.name === 'child' && !d.theme.childId) d.theme.name = 'purple';
  return d;
}

/* ---------- armazenamento ---------- */
const Store = {
  load() {
    try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  save(obj) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); return true; } catch (e) { return false; }
  },
  readLegacyLocal() {
    try { const raw = localStorage.getItem(LEGACY_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  },
  readLegacyNotes() {
    try { const v = JSON.parse(localStorage.getItem(LEGACY_NOTES_KEY) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; }
  },
  readLegacyDB() {
    // Lê a cópia que a v67 guardava no IndexedDB, sem criar nada se ela não existir.
    return new Promise(resolve => {
      let done = false; const finish = v => { if (!done) { done = true; resolve(v); } };
      setTimeout(() => finish(null), 2500);
      try {
        if (!window.indexedDB) return finish(null);
        const req = indexedDB.open(LEGACY_DB);
        req.onupgradeneeded = e => { try { e.target.transaction.abort(); } catch (_) {} finish(null); };
        req.onerror = () => finish(null);
        req.onsuccess = () => {
          const db = req.result;
          try {
            if (!db.objectStoreNames.contains('app')) { db.close(); return finish(null); }
            const r = db.transaction('app', 'readonly').objectStore('app').get('data');
            r.onsuccess = () => { db.close(); finish(r.result || null); };
            r.onerror = () => { db.close(); finish(null); };
          } catch (_) { db.close(); finish(null); }
        };
      } catch (_) { finish(null); }
    });
  }
};

async function migrateLegacy(defaultKeys) {
  const local = Store.readLegacyLocal();
  const db = await Store.readLegacyDB();
  let base = null;
  if (local && db) {
    base = Date.parse(db.updatedAt || 0) > Date.parse(local.updatedAt || 0) ? db : local;
    const other = base === db ? local : db;
    // completa fotos que só existam na outra cópia
    (base.children || []).forEach(c => { const o = (other.children || []).find(x => x.id === c.id); if (o && o.photo && !c.photo) c.photo = o.photo; });
  } else base = local || db;
  if (!base) return null;
  const notes = Store.readLegacyNotes();
  base.privateChildNotes = [...(Array.isArray(base.privateChildNotes) ? base.privateChildNotes : []), ...notes];
  const d = normalize(base, defaultKeys);
  d.onboardingComplete = true;
  d.migratedFrom = 'v67';
  return d;
}

/* =====================================================================
   Combinação de mudanças entre aparelhos (merge de 3 vias).
   base   = última versão que os dois aparelhos tinham em comum
   local  = o que este aparelho tem agora
   remote = o que está no servidor agora
   ===================================================================== */

const DELTA_FIELDS = new Set(['points', 'piggy', 'xp']); // somam as diferenças dos dois lados

function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function same(a, b) { return stable(a) === stable(b); }
function isPlainObj(v) { return !!v && typeof v === 'object' && !Array.isArray(v); }
function isIdArray(...arrs) {
  const present = arrs.filter(a => a !== undefined && a !== null);
  return present.length > 0 && present.every(a => Array.isArray(a) && a.every(x => isPlainObj(x) && x.id !== undefined))
    && present.some(a => a.length > 0);
}

function merge3(base, local, remote, key) {
  if (same(local, base)) return remote;
  if (same(remote, base)) return local;
  // Pontos, cofrinho e XP: as mudanças dos dois lados são acontecimentos diferentes, então somam
  // (mesmo quando os dois lados chegaram ao mesmo número).
  if (DELTA_FIELDS.has(key) && typeof local === 'number' && typeof remote === 'number') {
    const b = typeof base === 'number' ? base : 0;
    const v = remote + (local - b);
    return key === 'piggy' ? Math.max(0, Math.round(v * 100) / 100) : Math.max(0, Math.round(v));
  }
  if ((local === null || typeof local !== 'object') && same(local, remote)) return local;
  if (isIdArray(base, local, remote)) return mergeIdArray(base || [], local || [], remote || []);
  if (isPlainObj(local) && isPlainObj(remote)) {
    const out = {};
    const b = isPlainObj(base) ? base : {};
    const keys = new Set([...Object.keys(remote), ...Object.keys(local)]);
    keys.forEach(k => {
      const inL = k in local, inR = k in remote, inB = k in b;
      if (inB && (!inL || !inR)) {            // apagado de um lado
        const other = inL ? local[k] : remote[k];
        if (same(other, b[k])) return;        // o outro lado não mexeu: apaga
        out[k] = other; return;               // o outro lado mexeu: mantém a mudança
      }
      const v = merge3(b[k], local[k], remote[k], k);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  return local; // os dois mudaram o mesmo valor: vale o deste aparelho
}

function mergeIdArray(base, local, remote) {
  const B = new Map(base.map(x => [String(x.id), x]));
  const L = new Map(local.map(x => [String(x.id), x]));
  const R = new Map(remote.map(x => [String(x.id), x]));
  const order = [...remote.map(x => String(x.id)), ...local.map(x => String(x.id)).filter(id => !R.has(id))];
  const out = [];
  order.forEach(id => {
    const b = B.get(id), l = L.get(id), r = R.get(id);
    if (b && (!l || !r)) return;              // apagado de um lado: some
    if (l && r) out.push(merge3(b, l, r)); else out.push(l || r);
  });
  return out;
}

/** Corrige casos raros depois de combinar (ex.: a mesma aprovação feita nos dois aparelhos). */
function reconcileState(d) {
  const seen = new Set();
  d.history = d.history.filter(h => {
    if (!h.approvalId) return true;
    if (!seen.has(h.approvalId)) { seen.add(h.approvalId); return true; }
    const c = d.children.find(x => x.id === h.childId);
    if (c) {
      c.points = Math.max(0, c.points - h.points);
      if (h.type === 'task') c.xp = Math.max(0, c.xp - Math.max(0, h.points));
      d.piggyHistory.filter(p => p.historyId === h.id).forEach(p => { c.piggy = Math.max(0, Math.round((c.piggy - p.amount) * 100) / 100); });
    }
    d.piggyHistory = d.piggyHistory.filter(p => p.historyId !== h.id);
    return false;
  });
  d.approvals.forEach(a => {
    const h = d.history.find(x => x.approvalId === a.id);
    if (h && a.status !== 'approved') { a.status = 'approved'; a.historyId = h.id; }
  });
  return d;
}

if (typeof module !== 'undefined') module.exports = { merge3, mergeIdArray, same, reconcileState };

/* =====================================================================
   Regras do aplicativo. Todas as mudanças de dados passam por aqui.
   ===================================================================== */

let S = null; // estado (dados salvos)

function childById(id) { return S.children.find(c => c.id === id) || null; }
function taskById(id) { return S.tasks.find(t => String(t.id) === String(id)) || null; }
function rewardById(id) { return S.rewards.find(r => String(r.id) === String(id)) || null; }
function isChildMode() { return S.mode.current === 'child' && !!childById(S.mode.childId); }
function activeChild() { return isChildMode() ? childById(S.mode.childId) : null; }
function visibleChildren() { const c = activeChild(); return c ? [c] : S.children; }
function canSeeChild(id) { const c = activeChild(); return !c || c.id === id; }

/* ---------- valores ---------- */
function taskCashPerPoint(t) { return t.cashPerPoint === null || t.cashPerPoint === undefined ? Number(S.defaultPointValue || 0) : Number(t.cashPerPoint || 0); }
function taskCash(t) { return round2(Number(t.points || 0) * taskCashPerPoint(t) + Number(t.fixedCash || 0)); }
function pointsToCash(points, t) { return round2(Math.max(0, points) * (t ? taskCashPerPoint(t) : Number(S.defaultPointValue || 0)) + (t ? Number(t.fixedCash || 0) : 0)); }

/* ---------- agenda das tarefas ---------- */
function taskForChild(t, c) { return !!c && (!t.childIds.length || t.childIds.includes(c.id)); }
function tasksForChild(c) { return S.tasks.filter(t => taskForChild(t, c)); }
function scheduledOn(t, date) { return !t.days.length || t.days.includes(toDate(date).getDay()); }
function periodMatch(t, a, b) { return t.frequency === 'weekly' ? weekKey(a) === weekKey(b) : dayKey(a) === dayKey(b); }
/** Situação da tarefa para a criança hoje: open | done | pending | off (fora do dia) | free (avulsa) */
function taskStatus(t, c, now = new Date()) {
  if (t.frequency === 'oneOff') {
    const pend = S.approvals.find(a => a.status === 'pending' && a.kind === 'task' && a.childId === c.id && a.taskId === t.id);
    return pend ? { state: 'pending', approval: pend } : { state: 'free' };
  }
  if (t.frequency === 'daily' && !scheduledOn(t, now)) return { state: 'off' };
  const done = S.history.find(h => h.type === 'task' && h.childId === c.id && h.taskId === t.id && periodMatch(t, h.date, now));
  if (done) return { state: 'done', entry: done };
  const pend = S.approvals.find(a => a.status === 'pending' && a.kind === 'task' && a.childId === c.id && a.taskId === t.id && periodMatch(t, a.submittedAt, now));
  if (pend) return { state: 'pending', approval: pend };
  return { state: 'open' };
}
function childToday(c) {
  const list = tasksForChild(c).filter(t => t.frequency !== 'oneOff').map(t => taskStatus(t, c)).filter(s => s.state !== 'off');
  return { done: list.filter(s => s.state === 'done').length, total: list.length };
}

/* ---------- sequência, nível e medalhas ---------- */
function computeStreak(c) {
  const days = new Set(S.history.filter(h => h.type === 'task' && h.childId === c.id).map(h => dayKey(h.date)));
  let d = new Date(); if (!days.has(dayKey(d))) d = addDays(d, -1);
  let n = 0; while (days.has(dayKey(d))) { n++; d = addDays(d, -1); }
  return n;
}
function levelOf(c) { return Math.max(1, Math.floor(Number(c.xp || 0) / 100) + 1); }
function checkAchievements(c) {
  const tests = {
    'first-task': () => S.history.some(h => h.type === 'task' && h.childId === c.id),
    'streak-7': () => computeStreak(c) >= 7,
    'level-5': () => levelOf(c) >= 5,
    'piggy-50': () => Number(c.piggy || 0) >= 50
  };
  const fresh = [];
  ACHIEVEMENTS.forEach(a => {
    if (tests[a.code]() && !S.achievements.some(x => x.code === a.code && x.childId === c.id)) {
      S.achievements.unshift({ id: uid('ac'), code: a.code, childId: c.id, date: isoNow() }); fresh.push(a);
    }
  });
  return fresh;
}
function medalsOf(c) { return S.achievements.filter(a => a.childId === c.id).map(a => ACHIEVEMENTS.find(x => x.code === a.code)).filter(Boolean); }

/* ---------- histórico ---------- */
function addHistory(entry) {
  const h = { id: uid('h'), date: isoNow(), taskId: null, rewardId: null, note: '', description: '', points: 0, cash: 0, approvalId: null, ...entry };
  S.history.unshift(h); return h;
}
function addPiggy(c, amount, note, source, historyId, date) {
  const before = c.piggy; c.piggy = round2(Math.max(0, c.piggy + amount)); const real = round2(c.piggy - before);
  if (real) S.piggyHistory.unshift({ id: uid('p'), date: date || isoNow(), childId: c.id, amount: real, note: text(note, 120), source, historyId: historyId || null });
  return real;
}
function changePoints(c, delta) { const before = c.points; c.points = Math.max(0, c.points + delta); return c.points - before; }

/** Concede a tarefa (pontos, dinheiro, XP). Retorna { entry, fresh } */
function grantTask(c, t, note, date, approvalId) {
  const when = date || isoNow();
  const cash = taskCash(t);
  changePoints(c, t.points);
  c.xp = Number(c.xp || 0) + t.points;
  const entry = addHistory({ date: when, type: 'task', childId: c.id, childName: c.name, taskId: t.id, note: text(note, 200), description: t.nameKey ? '' : t.name, points: t.points, cash: 0, approvalId: approvalId || null });
  if (cash > 0) entry.cash = addPiggy(c, cash, '', 'task', entry.id, when);
  const fresh = checkAchievements(c);
  return { entry, fresh };
}

/** Criança ou responsável marca a tarefa. */
function completeTask(childId, taskId, note) {
  const c = childById(childId), t = taskById(taskId);
  if (!c || !t || !taskForChild(t, c)) return { ok: false, reason: 'invalid' };
  const st = taskStatus(t, c);
  if (st.state === 'done') return { ok: false, reason: t.frequency === 'weekly' ? 'doneWeek' : 'doneToday' };
  if (st.state === 'pending') return { ok: false, reason: 'pending' };
  if (st.state === 'off') return { ok: false, reason: 'off' };
  if (isChildMode() && t.approvalRequired) {
    const a = { id: uid('a'), kind: 'task', childId: c.id, taskId: t.id, rewardId: null, label: t.nameKey ? '' : t.name, points: t.points, note: text(note, 200), status: 'pending', submittedAt: isoNow(), reviewedAt: null, reason: '', historyId: null };
    S.approvals.unshift(a);
    return { ok: true, pending: true, approval: a };
  }
  const r = grantTask(c, t, note);
  return { ok: true, pending: false, ...r };
}

/** Desfaz um registro do histórico, devolvendo pontos e dinheiro. */
function undoHistory(id) {
  const i = S.history.findIndex(h => h.id === id); if (i < 0) return false;
  const h = S.history[i], c = childById(h.childId);
  if (c) {
    changePoints(c, -h.points);
    if (h.type === 'task') c.xp = Math.max(0, Number(c.xp || 0) - Math.max(0, h.points));
    const linked = S.piggyHistory.filter(p => p.historyId === h.id);
    linked.forEach(p => { c.piggy = round2(Math.max(0, c.piggy - p.amount)); });
    S.piggyHistory = S.piggyHistory.filter(p => p.historyId !== h.id);
    if (!linked.length && h.cash) c.piggy = round2(Math.max(0, c.piggy - h.cash));
    if (['english', 'homework', 'game'].includes(h.type)) c.xp = Math.max(0, Number(c.xp || 0) - Math.max(0, h.points));
  }
  S.english.sessions = S.english.sessions.filter(x => x.historyId !== h.id);
  S.homework.entries = S.homework.entries.filter(x => x.historyId !== h.id);
  S.games.wins = S.games.wins.filter(x => x.historyId !== h.id);
  S.homework.entries.forEach(x => { if (x.taskHistoryId === h.id) x.taskHistoryId = null; });
  if (h.approvalId) { const a = S.approvals.find(x => x.id === h.approvalId); if (a) a.status = 'reverted'; }
  S.behaviorNotes = S.behaviorNotes.filter(n => n.historyId !== h.id);
  S.history.splice(i, 1);
  return true;
}

/* ---------- lição de casa ---------- */
const HW_SUBJECTS = ['pt', 'math', 'science', 'english', 'social', 'reading', 'writing', 'other'];
function homeworkPointsFor(pages) { return Math.max(0, pages) * S.homework.settings.pointsPerPage; }
function homeworkPages(c, from, to) { return S.homework.entries.filter(x => x.childId === c.id && Date.parse(x.date) >= from.getTime() && (!to || Date.parse(x.date) < to.getTime())).reduce((s, x) => s + x.pages, 0); }
/** A tarefa "Fazer a lição de casa" desta criança, se existir. */
function homeworkTaskFor(c) {
  return tasksForChild(c).find(x => x.nameKey === 'lib_homework') || tasksForChild(c).find(x => !x.nameKey && /li[cç][aã]o|dever de casa/i.test(x.name)) || null;
}
function grantHomework(c, pages, subject, note, date, approvalId) {
  const when = date || isoNow(), pts = homeworkPointsFor(pages);
  changePoints(c, pts); c.xp = Number(c.xp || 0) + pts;
  const entry = addHistory({ date: when, type: 'homework', childId: c.id, childName: c.name, note: text(note, 200), points: pts, pages, subject: HW_SUBJECTS.includes(subject) ? subject : 'other', approvalId: approvalId || null });
  const rec = { id: uid('hw'), childId: c.id, date: when, pages, subject: HW_SUBJECTS.includes(subject) ? subject : 'other', note: text(note, 200), historyId: entry.id, taskHistoryId: null };
  // marca junto a tarefa "Fazer a lição de casa" daquele dia, se ainda não foi marcada
  let taskEntry = null;
  const task = S.homework.settings.autoTask ? homeworkTaskFor(c) : null;
  if (task && task.frequency !== 'oneOff' && (task.frequency !== 'daily' || scheduledOn(task, when))
      && !S.history.some(h => h.type === 'task' && h.childId === c.id && h.taskId === task.id && periodMatch(task, h.date, when))) {
    taskEntry = grantTask(c, task, '', when).entry; rec.taskHistoryId = taskEntry.id;
  }
  S.homework.entries.unshift(rec);
  S.homework.entries.sort((x, y) => y.date.localeCompare(x.date)); S.history.sort((x, y) => y.date.localeCompare(x.date));
  return { entry, taskEntry, fresh: checkAchievements(c), points: pts + (taskEntry ? taskEntry.points : 0) };
}
function logHomework(childId, pages, subject, note, date) {
  const c = childById(childId); pages = clamp(int(pages, 0), 0, 200);
  if (!c || !pages) return { ok: false, reason: 'pages' };
  if (isChildMode()) {
    const a = { id: uid('a'), kind: 'homework', childId: c.id, taskId: null, rewardId: null, label: '', points: homeworkPointsFor(pages), note: text(note, 200), status: 'pending', submittedAt: isoNow(), reviewedAt: null, reason: '', historyId: null, pages, subject, studyDate: date || isoNow() };
    S.approvals.unshift(a); return { ok: true, pending: true };
  }
  return { ok: true, pending: false, ...grantHomework(c, pages, subject, note, date) };
}
function deleteHomework(id) {
  const x = S.homework.entries.find(e => e.id === id); if (!x) return false;
  if (x.taskHistoryId && S.history.some(h => h.id === x.taskHistoryId)) undoHistory(x.taskHistoryId);
  if (x.historyId && S.history.some(h => h.id === x.historyId)) return undoHistory(x.historyId);
  S.homework.entries = S.homework.entries.filter(e => e.id !== id); return true;
}

/* ---------- recompensas ---------- */
function redeemReward(childId, rewardId) {
  const c = childById(childId), r = rewardById(rewardId);
  if (!c || !r) return { ok: false, reason: 'invalid' };
  if (isChildMode()) {
    if (S.approvals.some(a => a.status === 'pending' && a.kind === 'reward' && a.childId === c.id && a.rewardId === r.id)) return { ok: false, reason: 'pending' };
    if (c.points < r.cost) return { ok: false, reason: 'points' };
    const a = { id: uid('a'), kind: 'reward', childId: c.id, taskId: null, rewardId: r.id, label: r.nameKey ? '' : r.name, points: r.cost, note: '', status: 'pending', submittedAt: isoNow(), reviewedAt: null, reason: '', historyId: null };
    S.approvals.unshift(a);
    return { ok: true, pending: true };
  }
  if (c.points < r.cost) return { ok: false, reason: 'points' };
  changePoints(c, -r.cost);

}

/* ---------- aprovações ---------- */
function approve(id) {
  const a = S.approvals.find(x => x.id === id && x.status === 'pending'); if (!a) return { ok: false, reason: 'invalid' };
  const c = childById(a.childId); if (!c) return { ok: false, reason: 'invalid' };
  if (a.kind === 'task') {
    const t = taskById(a.taskId); if (!t) return { ok: false, reason: 'taskGone' };
    const dup = S.history.find(h => h.type === 'task' && h.childId === c.id && h.taskId === t.id && t.frequency !== 'oneOff' && periodMatch(t, h.date, a.submittedAt));
    if (dup) { a.status = 'rejected'; a.reason = 'duplicate'; a.reviewedAt = isoNow(); return { ok: false, reason: 'duplicate' }; }
    const r = grantTask(c, t, a.note, a.submittedAt, a.id);
    a.status = 'approved'; a.reviewedAt = isoNow(); a.historyId = r.entry.id;
    return { ok: true, ...r, child: c };
  }
  if (a.kind === 'homework') {
    const r = grantHomework(c, a.pages, a.subject, a.note, a.studyDate, a.id);
    a.status = 'approved'; a.reviewedAt = isoNow(); a.historyId = r.entry.id;
    return { ok: true, ...r, child: c };
  }
  if (a.kind === 'english') {
    const r = grantEnglish(c, a.minutes, a.activity, a.note, a.studyDate, a.id);
    a.status = 'approved'; a.reviewedAt = isoNow(); a.historyId = r.entry.id;
    return { ok: true, ...r, child: c };
  }
  const rw = rewardById(a.rewardId); if (!rw) return { ok: false, reason: 'rewardGone' };
  if (c.points < rw.cost) return { ok: false, reason: 'points' };
  changePoints(c, -rw.cost);
  const entry = addHistory({ type: 'reward', childId: c.id, childName: c.name, rewardId: rw.id, description: rw.nameKey ? '' : rw.name, points: -rw.cost, approvalId: a.id });
  a.status = 'approved'; a.reviewedAt = isoNow(); a.historyId = entry.id;
  return { ok: true, entry, child: c };
}
function reject(id, reason) {

  a.status = 'rejected'; a.reason = text(reason, 200); a.reviewedAt = isoNow(); return true;
}
function pendingApprovals() { return S.approvals.filter(a => a.status === 'pending'); }

/* ---------- inglês ---------- */
const EN_ACTIVITIES = ['app', 'video', 'class', 'book', 'music', 'talk', 'homework', 'other'];
function englishLevel(age) { return age < 3 ? 0 : age <= 4 ? 1 : age <= 6 ? 2 : 3; }
function englishDefaultGoal(age) { return age < 3 ? 20 : age <= 4 ? 30 : age <= 6 ? 60 : age <= 9 ? 90 : 120; }
function englishGoal(c) { const g = S.english.settings.goals[c.id]; return g === undefined ? englishDefaultGoal(c.age) : g; }
function englishPointsFor(minutes) { return Math.floor(Math.max(0, minutes) / 15) * S.english.settings.pointsPer15; }
function englishMinutes(c, from, to) {
  const a = from ? from.getTime() : 0, b = to ? to.getTime() : Infinity;
  return S.english.sessions.filter(x => x.childId === c.id).filter(x => { const t = Date.parse(x.date); return t >= a && t < b; }).reduce((s, x) => s + x.minutes, 0);
}
function weekStart(d = new Date()) { return keyToDate(weekKey(d)); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function grantEnglish(c, minutes, activity, note, date, approvalId) {

}
function logEnglish(childId, minutes, activity, note, date) {

function englishTestDue(c, now = new Date()) { return englishLevel(c.age) > 0 && now.getDate() >= S.english.settings.testDay && !englishTestThisMonth(c, now); }

/* ---------- comportamento, perdas e ajustes ---------- */
function recordBehavior(childId, type, note, points, cash) {
  const c = childById(childId); if (!c) return null;
  const sign = type === 'positive' ? 1 : -1;
  const dp = changePoints(c, sign * Math.max(0, int(points, 0)));
  const entry = addHistory({ type: 'behavior', childId: c.id, childName: c.name, description: text(note, 300), points: dp });
  const dc = cash ? addPiggy(c, sign * Math.max(0, round2(num(cash))), note, 'behavior', entry.id) : 0;
  entry.cash = dc;
  S.behaviorNotes.unshift({ id: uid('b'), date: entry.date, childId: c.id, type: sign > 0 ? 'positive' : 'negative', text: text(note, 300), points: Math.abs(dp), cash: Math.abs(dc), historyId: entry.id });
  if (sign > 0) checkAchievements(c);
  return entry;
}
function adjustPoints(childId, points, reason) {
  const c = childById(childId); if (!c) return null;
  const dp = changePoints(c, int(points, 0)); if (!dp) return null;
  return addHistory({ type: 'adjust', childId: c.id, childName: c.name, description: text(reason, 120), points: dp });
}
function movePiggy(childId, amount, note) {
  const c = childById(childId); if (!c) return 0;
  const real = addPiggy(c, round2(amount), note, 'manual');
  if (real > 0) checkAchievements(c);
  return real;
}

/* ---------- métricas para relatórios ---------- */
function taskEntries(c, sinceDate) { const since = sinceDate ? sinceDate.getTime() : 0; return S.history.filter(h => h.type === 'task' && h.childId === c.id && Date.parse(h.date) >= since); }
function expectedBetween(c, from, days) {
  let expected = 0;
  const tasks = tasksForChild(c).filter(t => t.frequency !== 'oneOff');
  const weeks = new Set();
  for (let i = 0; i < days; i++) {
    const d = addDays(from, i);
    tasks.forEach(t => { if (t.frequency === 'daily' && scheduledOn(t, d)) expected++; });
    weeks.add(weekKey(d));
  }
  expected += tasks.filter(t => t.frequency === 'weekly').length * weeks.size;
  return expected;
}
function completionRate(c, from, days) {
  const exp = expectedBetween(c, from, days); if (!exp) return 0;
  const end = addDays(from, days).getTime();
  const done = S.history.filter(h => { if (h.type !== 'task' || h.childId !== c.id) return false; const t = Date.parse(h.date); if (t < from.getTime() || t >= end) return false; const task = taskById(h.taskId); return !task || task.frequency !== 'oneOff'; }).length;
  return Math.min(100, Math.round(done / exp * 100));
}
function familyWeekRate() {
  const from = daysAgo(6); let exp = 0, done = 0;
  S.children.forEach(c => { const e = expectedBetween(c, from, 7); exp += e; done += Math.min(e, taskEntries(c, from).filter(h => { const t = taskById(h.taskId); return !t || t.frequency !== 'oneOff'; }).length); });
  return exp ? Math.min(100, Math.round(done / exp * 100)) : 0;
}
function childMetrics(c) {
  const since = daysAgo(29);
  const entries = taskEntries(c, since);
  const all = taskEntries(c);
  const approvals = S.approvals.filter(a => a.childId === c.id && a.kind === 'task');
  const approved = approvals.filter(a => a.status === 'approved').length;
  const rejected = approvals.filter(a => a.status === 'rejected').length;
  const pending = approvals.filter(a => a.status === 'pending').length;
  const rate = completionRate(c, since, 30);
  const behavior = S.behaviorNotes.filter(n => n.childId === c.id);
  const positive = behavior.filter(n => n.type === 'positive').length, negative = behavior.length - positive;
  const streak = computeStreak(c);
  const score = clamp(rate / 100 * 6 + Math.min(streak, 14) / 14 * 2 + (positive + 1) / (positive + negative + 2) * 2, 0, 10);
  const daily = []; for (let i = 29; i >= 0; i--) { const k = dayKey(daysAgo(i)); daily.push({ key: k, n: entries.filter(h => dayKey(h.date) === k).length }); }
  let bestWeek = 0;
  for (let w = 0; w < 4; w++) { const from = daysAgo(27 - w * 7); bestWeek = Math.max(bestWeek, completionRate(c, from, 7)); }
  const byTask = new Map(); all.forEach(h => { const k = h.taskId ?? ('d:' + h.description); byTask.set(k, (byTask.get(k) || 0) + 1); });
  const topTasks = [...byTask.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  const timeline = [
    ...S.history.filter(h => h.childId === c.id && Date.parse(h.date) >= since.getTime()).map(h => ({ date: h.date, kind: 'history', ref: h })),
    ...approvals.filter(a => a.status !== 'approved' && Date.parse(a.submittedAt) >= since.getTime()).map(a => ({ date: a.reviewedAt || a.submittedAt, kind: 'approval', ref: a }))
  ].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  const notes = S.privateNotes.filter(n => n.childId === c.id).length;
  const last = S.history.find(h => h.childId === c.id);
  return { approved, rejected, pending, rate, positive, negative, streak, score, daily, bestWeek, topTasks, timeline, notes, completed: all.length, last: last ? last.date : null };
}
function financeSummary(c, days) {
  const since = days ? daysAgo(days - 1).getTime() : 0;
  let gained = 0, lost = 0;
  S.piggyHistory.filter(p => p.childId === c.id && Date.parse(p.date) >= since && p.source !== 'manual').forEach(p => { if (p.amount > 0) gained += p.amount; else lost -= p.amount; });
  return { gained: round2(gained), lost: round2(lost) };
}

/* ---------- tema ---------- */
function currentPalette() {
  const th = S.theme;
  if (th.name === 'custom' && th.custom) return th.custom;
  if (th.name === 'child') { const c = childById(th.childId); if (c) return childPalette(c.accentColor); }
  return PRESET_THEMES[th.name] || PRESET_THEMES.purple;
}
function childPalette(color) { return { sidebar1: shade(color, -60), sidebar2: shade(color, -32), btn1: color, btn2: shade(color, -16) }; }
function applyTheme() {
  const root = document.documentElement.style;
  const child = activeChild();
  const p = currentPalette();
  root.setProperty('--sidebar1', p.sidebar1); root.setProperty('--sidebar2', p.sidebar2);
  const accent = child ? child.accentColor : p.btn1;
  root.setProperty('--primary', child ? child.accentColor : p.btn1);
  root.setProperty('--primary2', child ? shade(child.accentColor, -16) : p.btn2);
  root.setProperty('--accent', accent);
  root.setProperty('--accent-soft', `color-mix(in srgb, ${accent} 12%, #fff)`);
  root.setProperty('--tint', `color-mix(in srgb, ${p.btn1} 8%, #fff)`);
  document.body.classList.toggle('child-mode', !!child);
  const meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', p.sidebar1);
}

function card(title, body, { id = '', cls = '', head = '' } = {}) {
  return `<div class="card ${cls}" ${id ? `id="${id}"` : ''}><div class="card-head"><h2>${title}</h2>${head}</div>${body}</div>`;
}
function historyRow(h, { undo = true } = {}) {
  const c = childById(h.childId);
  const money = h.cash ? `<span class="pill ${h.cash > 0 ? 'money' : 'bad'}">${signedMoney(h.cash)}</span>` : '';
  return `<div class="item"><div class="meta">${c ? avatar(c, 'sm') : ''}<div><strong>${esc(childName(h.childId, h.childName))}</strong><div class="sub">${esc(historyText(h))}</div><div class="sub">${fmtDateTime(h.date)}</div></div></div>
    <div class="right"><span class="pill ${h.points < 0 ? 'bad' : ''}">${signed(h.points)}</span>${money}${undo ? `<button type="button" class="icon-btn parent-only" data-act="undo" data-id="${esc(h.id)}" title="${esc(t('undo'))}" aria-label="${esc(t('undo'))}">↩︎</button>` : ''}</div></div>`;
}
function taskValueLine(task) { const v = taskCash(task); return v > 0 ? `<div class="money-line">${t('taskValue')}: ${money(v)}</div>` : ''; }
function missionRow(c, task, st, { showChild = false } = {}) {
  let right = '';
  if (st.state === 'open' || st.state === 'free') right = `<button type="button" class="btn btn-success btn-sm" data-act="complete" data-child="${esc(c.id)}" data-task="${task.id}">✔ ${t('markDone')}</button>`;
  else if (st.state === 'pending') right = `<span class="pill wait">⏳ ${t('awaitingApproval')}</span>${!isChildMode() ? `<button type="button" class="btn btn-success btn-sm" data-act="approve" data-id="${esc(st.approval.id)}">${t('approve')}</button>` : ''}`;
  else if (st.state === 'done') right = `<span class="pill ok">✔ ${t(task.frequency === 'weekly' ? 'doneWeek' : 'doneToday')}</span><button type="button" class="icon-btn parent-only" data-act="undo" data-id="${esc(st.entry.id)}" title="${esc(t('undo'))}">↩︎</button>`;
  else right = `<span class="pill">${t('notToday')}</span>`;
  const cls = st.state === 'done' ? 'done' : st.state === 'pending' ? 'wait' : '';
  const sub = showChild ? `${esc(c.name)} · +${pts(task.points)}` : `${esc(freqName(task))} · +${pts(task.points)}${task.time ? ` · 🕒 ${task.time}` : ''}`;
  return `<div class="item ${cls}" ${st.state === 'off' ? 'style="opacity:.6"' : ''}><div class="meta">${showChild ? avatar(c, 'sm') : `<span class="ico">${esc(task.icon)}</span>`}<div><strong>${showChild ? esc(task.icon) + ' ' : ''}${esc(taskName(task))}</strong><div class="sub">${sub}</div>${taskValueLine(task)}</div></div><div class="right">${right}</div></div>`;
}
function goalsList(list, manage) {
  if (!list.length) return emptyBox(t('noGoals'));
  return list.map(g => {
    const c = childById(g.childId); if (!c) return '';
    const pct = Math.min(100, c.piggy / g.target * 100);
    return `<div class="item" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div class="meta">${avatar(c, 'sm')}<div><strong>🎯 ${esc(g.name)}</strong><div class="sub">${esc(c.name)}: ${money(c.piggy)} ${t('of')} ${money(g.target)}${pct >= 100 ? ' · 🎉 ' + t('goalDone') : ''}</div></div></div>${manage ? `<button type="button" class="icon-btn danger" data-act="del-goal" data-id="${esc(g.id)}" aria-label="${esc(t('delete'))}">🗑️</button>` : ''}</div><div class="progress" style="--accent:${c.progressColor}"><span style="width:${pct}%;background:${c.progressColor}"></span></div></div>`;
  }).join('');
}

      let html = short.map((n, i) => `<div class="wd wd-${i}">${esc(n)}</div>`).join('');
      const first = new Date(y, m, 1), last = new Date(y, m + 1, 0);

/* ---------- cartão da próxima recompensa (modo criança) ---------- */
function nextRewardCard(c) {
  const list = [...S.rewards].sort((a, b) => a.cost - b.cost);
  const next = list.find(r => r.cost > c.points) || list[list.length - 1];
  if (!next) return '';
  const pct = Math.min(100, c.points / next.cost * 100);
  return `<div class="card" style="--c:${c.accentColor}"><div class="kpi-label">🎁 ${t('nextReward')}</div><h3 style="margin-top:6px">${esc(next.icon)} ${esc(rewardName(next))}</h3>
    <div class="progress"><span style="width:${pct}%"></span></div><div class="today-line">${c.points >= next.cost ? '✅ ' + t('canRedeem') : t('missingPts', { n: next.cost - c.points })}</div></div>`;
}

/* ---------- gráficos simples em SVG ---------- */
function lineChart(daily, color) {
  const w = 600, h = 170, p = 18, max = Math.max(1, ...daily.map(d => d.n));
  const x = i => p + i * (w - 2 * p) / (daily.length - 1), y = v => h - p - v / max * (h - 2 * p);
  const pts = daily.map((d, i) => `${x(i).toFixed(1)},${y(d.n).toFixed(1)}`).join(' ');
  const grid = [0, .5, 1].map(f => `<line x1="${p}" x2="${w - p}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#eceef7"/>`).join('');
  const dots = daily.map((d, i) => d.n ? `<circle cx="${x(i)}" cy="${y(d.n)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${fmtDate(keyToDate(d.key))}: ${d.n}</title></circle>` : '').join('');
  return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(t('last30'))}">${grid}<polyline points="${p},${h - p} ${pts} ${w - p},${h - p}" fill="${color}" fill-opacity=".08" stroke="none"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg><div class="hint" style="display:flex;justify-content:space-between"><span>${fmtDate(keyToDate(daily[0].key))}</span><span>${t('today')}</span></div>`;
}
function donut(pct, color) {
  const r = 52, c = 2 * Math.PI * r;
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="${pct}%"><circle cx="70" cy="70" r="${r}" fill="none" stroke="#eceef7" stroke-width="16"/>${pct > 0 ? `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="16" stroke-linecap="round" stroke-dasharray="${c * pct / 100} ${c}" transform="rotate(-90 70 70)"/>` : ''}<text x="70" y="76" text-anchor="middle" font-size="24" font-weight="900" fill="#22223b">${pct}%</text></svg><p class="hint" style="text-align:center">${t('last30')}</p>`;
}

/* =====================================================================
   Sincronização entre aparelhos (Supabase).
   O app continua funcionando sem internet: as mudanças ficam guardadas
   neste aparelho e são enviadas quando a conexão voltar.
   ===================================================================== */

const CLOUD_KEY = 'familiaMissao.cloud';
const CLOUD_BASE_KEY = 'familiaMissao.cloudBase';
const SUPABASE_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js';

/* ---------- adaptador para o Supabase ---------- */
function loadScriptOnce(src) {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => resolve(); s.onerror = () => reject(Object.assign(new Error('lib_load'), { code: 'lib_load' }));
    document.head.appendChild(s);
  });
}
async function createSupabaseAdapter(url, key) {
  await loadScriptOnce(SUPABASE_LIB);
  const sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'familiaMissao.auth' } });
  const unwrap = ({ data, error }) => { if (error) throw error; return data; };
  const who = s => (s && s.user ? { email: s.user.email, userId: s.user.id } : null);
  return {
    async session() { const { data } = await sb.auth.getSession(); return who(data.session); },
    onAuth(cb) { sb.auth.onAuthStateChange((event, s) => cb(event, who(s))); },
    async signUp(email, password, redirect) { const d = unwrap(await sb.auth.signUp({ email, password, options: { emailRedirectTo: redirect } })); return { needsConfirm: !d.session }; },
    async signIn(email, password) { unwrap(await sb.auth.signInWithPassword({ email, password })); },
    async signOut() { await sb.auth.signOut(); },
    async resetPassword(email, redirect) { unwrap(await sb.auth.resetPasswordForEmail(email, { redirectTo: redirect })); },
    async updatePassword(password) { unwrap(await sb.auth.updateUser({ password })); },
    async myFamilies() { return unwrap(await sb.rpc('my_families')) || []; },
    async createFamily(name, data) { const rows = unwrap(await sb.rpc('create_family', { p_name: name, p_data: data })); return rows[0]; },
    async joinFamily(code) { return unwrap(await sb.rpc('join_family', { p_code: code })); },
    async getVersion(fid) { const d = unwrap(await sb.from('family_sync').select('version').eq('family_id', fid).maybeSingle()); if (!d) throw Object.assign(new Error('not_member'), { code: 'not_member' }); return Number(d.version); },
    async getState(fid) { const d = unwrap(await sb.from('family_state').select('data,version').eq('family_id', fid).maybeSingle()); if (!d) throw Object.assign(new Error('not_member'), { code: 'not_member' }); return { data: d.data, version: Number(d.version) }; },
    async saveState(fid, version, data) { return Number(unwrap(await sb.rpc('save_state', { p_family: fid, p_expected: version, p_data: data }))); },
    async regenerateInvite(fid) { return unwrap(await sb.rpc('regenerate_invite', { p_family: fid })); },
    async leaveFamily(fid) { unwrap(await sb.rpc('leave_family', { p_family: fid })); },
    subscribe(fid, cb) {
      const ch = sb.channel('familia-' + fid).on('postgres_changes', { event: '*', schema: 'public', table: 'family_sync', filter: 'family_id=eq.' + fid }, () => cb()).subscribe();
      return () => { try { sb.removeChannel(ch); } catch (_) {} };
    }
  };
}

/* ---------- traduz erros para mensagens simples ---------- */
function cloudErrorKey(e) {
  const code = String((e && (e.code || e.error_code)) || ''), msg = String((e && e.message) || e || '').toLowerCase();
  if (code === 'lib_load') return 'cErrLib';
  if (code === 'bad_url') return 'cErrUrl';
  if (/failed to fetch|network|load failed|networkerror|fetch/.test(msg) || e instanceof TypeError) return 'cErrOffline';
  if (code === 'invalid_credentials' || /invalid login credentials/.test(msg)) return 'cErrLogin';
  if (code === 'email_not_confirmed' || /email not confirmed/.test(msg)) return 'cErrConfirm';
  if (code === 'user_already_exists' || /already registered|already exists/.test(msg)) return 'cErrExists';
  if (code === 'weak_password' || /password should be/.test(msg)) return 'cErrWeak';
  if (/rate limit|too many/.test(msg) || code.includes('rate_limit')) return 'cErrRate';
  if (/invalid_code/.test(msg)) return 'cErrCode';
  if (/not_member/.test(msg) || code === 'not_member') return 'cErrNotMember';
  if (/not_owner/.test(msg)) return 'cErrNotOwner';
  if (/data_too_large/.test(msg)) return 'cErrTooLarge';
  if (/invalid api key|no api key|jwt|apikey/.test(msg)) return 'cErrKey';
  if (/could not find the function|schema cache|does not exist/.test(msg)) return 'cErrSql';
  return 'cErrGeneric';
}

/* ---------- controle da sincronização ---------- */
const Cloud = {
  cfg: {}, adapter: null, status: 'off', errorKey: '', email: '', pushing: false, again: false, timer: null, unsub: null, poll: null, recovery: false,

  loadCfg() { try { this.cfg = JSON.parse(localStorage.getItem(CLOUD_KEY) || '{}') || {}; } catch (_) { this.cfg = {}; } },
  saveCfg() { try { localStorage.setItem(CLOUD_KEY, JSON.stringify(this.cfg)); } catch (_) {} },
  getBase() { try { const b = localStorage.getItem(CLOUD_BASE_KEY); return b ? JSON.parse(b) : null; } catch (_) { return null; } },
  setBase(obj) { try { localStorage.setItem(CLOUD_BASE_KEY, JSON.stringify(obj)); } catch (_) { localStorage.removeItem(CLOUD_BASE_KEY); } },
  linked() { return !!(this.adapter && this.cfg.familyId); },
  setStatus(st, errKey) { this.status = st; this.errorKey = errKey || ''; if (typeof renderCloudStatus === 'function') renderCloudStatus(); },
  appUrl() { const c = document.querySelector('link[rel=canonical]'); if (c && c.href) return c.href; return location.protocol.startsWith('http') ? location.origin + location.pathname : ''; },
  redirectUrl() { return this.appUrl() || undefined; },

  /** dados enviados ao servidor: tudo, menos o modo atual (que é de cada aparelho) */
  payload() { const d = JSON.parse(JSON.stringify(S)); delete d.mode; return d; },
  applyRemoteData(data) {
    const mode = S.mode;
    const next = normalize({ ...data, mode }, defaultKeys);
    next.onboardingComplete = true;
    S = next; Store.save(S); render();
  },

  async init() {
    this.loadCfg();
    if (!this.cfg.url || !this.cfg.key) { this.setStatus('off'); return; }
    this.setStatus('connecting');
    try {
      const factory = window.__CLOUD_ADAPTER_FACTORY || createSupabaseAdapter;
      this.adapter = await factory(this.cfg.url, this.cfg.key);
    } catch (e) { this.adapter = null; this.setStatus('error', cloudErrorKey(e)); return; }
    this.adapter.onAuth((event, who) => {
      if (event === 'PASSWORD_RECOVERY') { this.recovery = true; this.setStatus('recovery'); if (typeof openCloudSection === 'function') openCloudSection(); }
      if (event === 'SIGNED_OUT') { this.stopLive(); this.email = ''; if (this.status !== 'off') this.setStatus('login'); }
    });
    let who = null;
    try { who = await this.adapter.session(); } catch (e) { this.setStatus('error', cloudErrorKey(e)); return; }
    if (this.recovery) return;
    if (!who) { this.setStatus('login'); return; }
    this.email = who.email || '';
    if (!this.cfg.familyId) { try { this.families = await this.adapter.myFamilies(); } catch (_) { this.families = []; } this.setStatus('nofamily'); return; }
    await this.startLive();
  },

  async startLive() {
    this.stopLive();
    try { this.unsub = this.adapter.subscribe(this.cfg.familyId, () => this.pull()); } catch (_) {}
    this.poll = setInterval(() => { if (document.visibilityState !== 'hidden') this.pull(); }, 30000);
    await this.pull();
    if (this.cfg.dirty) this.schedulePush(0);
  },
  stopLive() { if (this.unsub) { this.unsub(); this.unsub = null; } if (this.poll) { clearInterval(this.poll); this.poll = null; } clearTimeout(this.timer); },

  /** chamado a cada mudança feita neste aparelho */
  onLocalChange() {
    if (!this.cfg.familyId) return;
    this.cfg.dirty = true; this.saveCfg();
    if (!this.adapter) return;
    this.setStatus('pending'); this.schedulePush();
  },
  schedulePush(ms = 1200) { clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), ms); },

  async push() {
    if (!this.linked()) return;
    if (this.pushing) { this.again = true; return; }
    this.pushing = true; this.setStatus('syncing');
    try {
      for (let attempt = 0; attempt < 4; attempt++) {
        const data = this.payload();
        const v = await this.adapter.saveState(this.cfg.familyId, this.cfg.version || 0, data);
        if (v > 0) { this.cfg.version = v; this.cfg.dirty = false; this.cfg.lastSync = isoNow(); this.setBase(data); this.saveCfg(); this.setStatus('synced'); break; }
        const remote = await this.adapter.getState(this.cfg.familyId);   // conflito: combina e tenta de novo
        this.mergeRemote(remote);
      }
    } catch (e) { this.fail(e); }
    finally { this.pushing = false; if (this.again) { this.again = false; this.schedulePush(300); } }
  },

  mergeRemote(remote) {
    const base = this.getBase();
    const local = this.payload();
    let merged = base ? merge3(base, local, remote.data) : remote.data;
    merged = reconcileState(normalize({ ...merged, mode: S.mode }, defaultKeys));
    this.cfg.version = remote.version; this.setBase(remote.data); this.saveCfg();
    S = merged; S.onboardingComplete = true; Store.save(S); render();
  },

  async pull() {
    if (!this.linked() || this.pushing) return;
    try {
      const v = await this.adapter.getVersion(this.cfg.familyId);
      if (v === this.cfg.version) { if (this.cfg.dirty) this.schedulePush(0); else this.setStatus('synced'); return; }
      const remote = await this.adapter.getState(this.cfg.familyId);
      if (this.cfg.dirty) { this.mergeRemote(remote); this.schedulePush(0); return; }
      this.cfg.version = remote.version; this.cfg.lastSync = isoNow(); this.setBase(remote.data); this.saveCfg();
      this.applyRemoteData(remote.data); this.setStatus('synced');
    } catch (e) { this.fail(e); }
  },

  fail(e) {
    const k = cloudErrorKey(e);
    if (k === 'cErrNotMember') { this.stopLive(); this.cfg.familyId = null; this.saveCfg(); this.setStatus('nofamily', k); return; }
    this.setStatus(k === 'cErrOffline' ? 'offline' : 'error', k);
  },

  /* ---------- ações da tela de sincronização ---------- */
  async connect(url, key) {
    this.stopLive(); this.adapter = null;
    this.cfg = { url, key }; this.saveCfg(); localStorage.removeItem(CLOUD_BASE_KEY);
    await this.init();
    return this.status !== 'error';
  },
  async signIn(email, password) { await this.adapter.signIn(email, password); this.email = email; await this.afterLogin(); },
  async signUp(email, password) {
    const r = await this.adapter.signUp(email, password, this.redirectUrl());
    if (r.needsConfirm) return { needsConfirm: true };
    this.email = email; await this.afterLogin(); return { needsConfirm: false };
  },
  async afterLogin() {
    this.families = await this.adapter.myFamilies();
    if (this.cfg.familyId && this.families.some(f => f.family_id === this.cfg.familyId)) { await this.startLive(); return; }
    this.cfg.familyId = null; this.saveCfg(); this.setStatus('nofamily');
  },
  inviteLink() {
    const base = this.appUrl();
    const token = btoa(unescape(encodeURIComponent(JSON.stringify({ u: this.cfg.url, k: this.cfg.key, c: this.cfg.inviteCode }))));
    return base ? `${base}#convite=${token}` : '';
  },
  /** link de convite: já traz o servidor e o código preenchidos */
  readInviteFromUrl() {
    const m = location.hash.match(/convite=([A-Za-z0-9+/=_-]+)/); if (!m) return;
    try {
      const inv = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')))));
      this.loadCfg();
      if (inv.u && inv.k && !this.cfg.familyId) { if (this.cfg.url !== inv.u || this.cfg.key !== inv.k) this.cfg = { url: inv.u, key: inv.k }; this.cfg.pendingCode = inv.c || ''; this.saveCfg(); }
    } catch (_) {}
    history.replaceState(null, '', location.pathname + location.search);
  },
  async createFamily() {
    const data = this.payload();
    const r = await this.adapter.createFamily(S.familyName, data);
    Object.assign(this.cfg, { familyId: r.family_id, inviteCode: r.invite_code, role: 'owner', members: 1, version: Number(r.version), dirty: false, lastSync: isoNow() });
    this.setBase(data); this.saveCfg(); await this.startLive(); this.setStatus('synced');
  },
  async useFamily(fid) {
    const remote = await this.adapter.getState(fid);
    const fams = await this.adapter.myFamilies(); const f = fams.find(x => x.family_id === fid) || {};
    Object.assign(this.cfg, { familyId: fid, inviteCode: f.invite_code, role: f.role, members: f.members, version: remote.version, dirty: false, lastSync: isoNow() });
    this.setBase(remote.data); this.saveCfg();
    this.applyRemoteData(remote.data);
    S.mode = { current: 'parent', childId: S.children[0].id }; Store.save(S);
    await this.startLive(); this.setStatus('synced');
  },
  async joinFamily(code) { const fid = await this.adapter.joinFamily(code); this.cfg.pendingCode = ''; await this.useFamily(fid); },
  async refreshInfo() {
    if (!this.linked()) return;
    try { const f = (await this.adapter.myFamilies()).find(x => x.family_id === this.cfg.familyId); if (f) { Object.assign(this.cfg, { inviteCode: f.invite_code, role: f.role, members: f.members }); this.saveCfg(); } } catch (_) {}
  },
  async newInvite() { this.cfg.inviteCode = await this.adapter.regenerateInvite(this.cfg.familyId); this.saveCfg(); },
  async signOut() { this.stopLive(); try { await this.adapter.signOut(); } catch (_) {} Object.assign(this.cfg, { familyId: null, version: 0, dirty: false }); localStorage.removeItem(CLOUD_BASE_KEY); this.saveCfg(); this.email = ''; this.setStatus('login'); },
  async leave() { await this.adapter.leaveFamily(this.cfg.familyId); this.stopLive(); Object.assign(this.cfg, { familyId: null, version: 0, dirty: false }); localStorage.removeItem(CLOUD_BASE_KEY); this.saveCfg(); this.setStatus('nofamily'); },
  disconnect() { this.stopLive(); try { this.adapter && this.adapter.signOut(); } catch (_) {} this.adapter = null; this.cfg = {}; localStorage.removeItem(CLOUD_KEY); localStorage.removeItem(CLOUD_BASE_KEY); this.setStatus('off'); }
};

window.addEventListener('online', () => { if (Cloud.linked()) { Cloud.pull(); if (Cloud.cfg.dirty) Cloud.schedulePush(0); } });
window.addEventListener('focus', () => { if (Cloud.linked()) Cloud.pull(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Cloud.linked()) Cloud.pull(); });

/* ---------- estrutura ---------- */
function buildShell() {
  document.body.innerHTML = `<header class="mobilebar" id="mobileBar"></header>
    <div class="drawer-backdrop" data-act="menu-close"></div>
    <div class="app">

/* Aviso quando o app é aberto por um endereço de teste da Vercel (protegido por login). */
function officialUrl() { const c = document.querySelector('link[rel=canonical]'); return c && c.href ? c.href : ''; }
function onTestCopy() {
  const off = officialUrl(); if (!off || !location.protocol.startsWith('http')) return false;

}
function renderHostBanner() {

/* ---------- instalar como app ---------- */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (S) render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; if (S) { render(); toast(t('installed'), 'success'); } });
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function installAvailable() { return !isStandalone() && location.protocol.startsWith('http') && (!!deferredInstall || isIOS()); }
async function doInstall() {
  closeMenu();
  if (deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (_) {} deferredInstall = null; render(); return; }
  Modal.open({ id: 'installModal', title: '📲 ' + t('installTitle'), body: `<p style="margin-top:0">${t('installIos')}</p><ol class="install-steps"><li>${t('installIos1')}</li><li>${t('installIos2')}</li><li>${t('installIos3')}</li></ol>`, foot: `<button type="button" class="btn btn-primary" data-act="close-modal">${t('close')}</button>` });
}
function installCardHtml() {
  if (isStandalone()) return `<p class="hint" style="margin:0">✅ ${t('installedHint')}</p>`;
  if (deferredInstall) return `<p class="hint" style="margin-top:-6px">${t('installHint')}</p><button type="button" class="btn btn-primary" data-act="install">📲 ${t('installBtn')}</button>`;
  if (isIOS()) return `<p class="hint" style="margin-top:-6px">${t('installIos')}</p><ol class="install-steps"><li>${t('installIos1')}</li><li>${t('installIos2')}</li><li>${t('installIos3')}</li></ol>`;
  return `<p class="hint" style="margin-top:-6px">${t('installHint')}</p><ol class="install-steps"><li>${t('installAndroid1')}</li><li>${t('installAndroid2')}</li></ol><p class="hint">${t('installUrl')} <strong>familia-em-missao.vercel.app</strong></p>`;
}

/* ---------- aviso de nova versão ---------- */
window.__onAppUpdate = function () {
  const busy = () => !!$('.modal') || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if (document.visibilityState === 'hidden' || !busy()) { location.reload(); return; }
  toast(t('updateAvailable'), 'success', { label: t('updateNow'), run: () => location.reload() }, 600000);
};

function showSection(id) {

function afterComplete(r, c, task) {
  if (!r.ok) { const msg = { doneToday: 'alreadyToday', doneWeek: 'alreadyWeek', pending: 'alreadyPending', off: 'notTodayMsg' }[r.reason]; toast(t(msg || 'genericError'), 'warn'); return; }
  commit();
  if (r.pending) {
    const aid = r.approval.id;
    toast(t('sentForApproval'), 'success', { label: t('undo'), run: () => { S.approvals = S.approvals.filter(a => a.id !== aid); commit(); toast(t('undone')); } });
    return;
  }
  const hid = r.entry.id;
  toast(t('earned', { name: c.name, n: task.points }) + (r.entry.cash ? ` (+${money(r.entry.cash)})` : '') + ' 🎉', 'success', { label: t('undo'), run: () => { undoHistory(hid); commit(); toast(t('undone')); } });
  celebrate(c, r.fresh, task.points);
}
function celebrate(c, fresh, gained) {
  (fresh || []).forEach((a, i) => setTimeout(() => toast(`${a.icon} ${c.name}: ${t(a.key)}!`, 'success'), 500 + i * 400));
  if (gained && c.points >= c.goal && c.points - gained < c.goal) setTimeout(() => toast(`🏆 ${t('goalReached', { name: c.name })}`, 'success'), 900);
}

function onPhotoChosen(e) {
  const file = e.target.files && e.target.files[0]; const c = childById(photoTarget);
  if (!file || !c) return;
  if (!file.type.startsWith('image/')) return toast(t('invalidImage'), 'warn');
  if (file.size > 15 * 1024 * 1024) return toast(t('largeImage'), 'warn');
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 320, cv = document.createElement('canvas'); cv.width = cv.height = size;
      const ctx = cv.getContext('2d'), sc = Math.max(size / img.width, size / img.height), w = img.width * sc, h = img.height * sc;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      const prev = c.photo; c.photo = cv.toDataURL('image/jpeg', 0.82);
      S.updatedAt = isoNow();
      if (!Store.save(S)) { c.photo = prev; toast(t('saveError'), 'error'); return; }

      render(); if ($('#childModal')) openChildEditor(c.id); toast(t('photoUpdated'), 'success');
    };
    img.onerror = () => toast(t('invalidImage'), 'error');
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function bindEvents() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act]; if (!fn) return;
    e.preventDefault(); touchUnlock(); fn(el, e);
  });
  document.addEventListener('change', e => {
    const chip = e.target.closest('.chip'); if (chip && e.target.type === 'checkbox') chip.classList.toggle('on', e.target.checked);
    const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el, e);
  });
  document.addEventListener('input', e => { const el = e.target.closest('[data-change]'); if (el && ['calc', 'values-preview', 'task-preview', 'tv-preview'].includes(el.dataset.change)) CHANGES[el.dataset.change](el, e); });
  document.addEventListener('keydown', e => {
    touchUnlock();
    if (e.key === 'Escape') { const m = Modal.top(); if (m) { e.preventDefault(); Modal.close(m.id); } else closeMenu(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  window.addEventListener('storage', e => {
    if (e.key === CLOUD_KEY) { Cloud.loadCfg(); renderCloudStatus(); return; }
    if (e.key !== STORE_KEY || !e.newValue) return;
    try { S = normalize(JSON.parse(e.newValue), defaultKeys); render(); } catch (_) {}
  });
  setInterval(() => {
    if (currentSection().guarded && !isChildMode() && !isUnlocked() && !$('#pinModal')) { ui.section = 'dashboard'; render(); toast(t('locked')); }
    const k = dayKey(); if (ui.today !== k) { ui.today = k; render(); }
  }, 15000);
}

/* ---------- inicialização ---------- */
async function boot() {
  let data = null, migrated = false;
  Cloud.readInviteFromUrl();
  const saved = Store.load();
  if (saved) { try { data = normalize(saved, defaultKeys); } catch (e) { console.warn('Dados salvos inválidos', e); } }
  if (!data) {
    try { data = await migrateLegacy(defaultKeys); migrated = !!data; } catch (e) { console.warn('Migração', e); }
  }
  if (!data) data = normalize(initialData(), defaultKeys);
  S = data; ui.today = dayKey();
  if (typeof seedExtras === 'function' && seedExtras()) Store.save(S);
  if (migrated) Store.save(S);
  const invited = !!Cloud.cfg.pendingCode;
  if (invited && !saved && !migrated) { S.onboardingComplete = true; ui.unlockedUntil = Date.now() + UNLOCK_MS; ui.section = 'nuvem'; }
  buildShell(); bindEvents(); render();
  if (migrated) toast(t('migratedMsg'), 'success');
  else if (!S.onboardingComplete) openOnboarding(0);
  Cloud.init().then(() => render());
}

/* ---------- ações ---------- */
async function cloudRun(el, fn) {
  if (el) el.disabled = true;
  try { await fn(); } catch (e) { const k = cloudErrorKey(e); Cloud.errorKey = k; toast(t(k), 'error'); }
  finally { if (el) el.disabled = false; ui.cloudRendered = null; render(); }
}
Object.assign(ACTIONS, {
  'cloud-connect': el => cloudRun(el, async () => {
    const url = text($('#cUrl').value, 200).replace(/\/+$/, ''), key = text($('#cKey').value, 400);
    if (!/^https:\/\/[a-z0-9.-]+$/i.test(url)) throw Object.assign(new Error('bad url'), { code: 'bad_url' });
    if (/^sb_secret_/i.test(key) || key.includes('service_role')) { toast(t('cErrSecret'), 'error'); return; }
    if (key.length < 20) { toast(t('cErrKeyShort'), 'warn'); return; }
    const ok = await Cloud.connect(url, key);
    if (ok) toast(t('cConnected'), 'success');
  }),
  'cloud-signin': el => cloudRun(el, async () => {
    const email = text($('#cEmail').value, 120), pass = $('#cPass').value;
    if (!email || !pass) { toast(t('cFillLogin'), 'warn'); return; }
    await Cloud.signIn(email, pass); Cloud.errorKey = ''; toast(t('cSignedIn'), 'success');
  }),
  'cloud-signup': el => cloudRun(el, async () => {
    const email = text($('#cEmail').value, 120), pass = $('#cPass').value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { toast(t('cFillLogin'), 'warn'); return; }
    if (pass.length < 6) { toast(t('cErrWeak'), 'warn'); return; }
    const r = await Cloud.signUp(email, pass); Cloud.errorKey = '';
    if (r.needsConfirm) toast(t('cConfirmEmail'), 'success'); else toast(t('cSignedIn'), 'success');
  }),
  'cloud-forgot': el => cloudRun(el, async () => {
    const email = text($('#cEmail').value, 120); if (!email) { toast(t('cTypeEmail'), 'warn'); return; }
    await Cloud.adapter.resetPassword(email, Cloud.redirectUrl()); toast(t('cResetSent'), 'success');
  }),
  'cloud-newpass': el => cloudRun(el, async () => {
    const p = $('#cNewPass').value; if (p.length < 6) { toast(t('cErrWeak'), 'warn'); return; }
    await Cloud.adapter.updatePassword(p); Cloud.recovery = false; toast(t('cPassChanged'), 'success'); await Cloud.init();
  }),
  'cloud-create': el => cloudRun(el, async () => { await Cloud.createFamily(); toast(t('cCreated'), 'success'); }),
  'cloud-join': el => cloudRun(el, async () => {
    const code = text($('#cCode').value, 20); if (!code) { toast(t('cTypeCode'), 'warn'); return; }
    if (!(await askConfirm(t('cJoinConfirm'), { danger: true, okLabel: t('cJoin') }))) return;
    await Cloud.joinFamily(code); toast(t('cJoined'), 'success');
  }),
  'cloud-use': el => cloudRun(el, async () => {
    if (!(await askConfirm(t('cJoinConfirm'), { danger: true, okLabel: t('cUseFamily') }))) return;
    await Cloud.useFamily(el.dataset.id); toast(t('cJoined'), 'success');
  }),
  'cloud-sync': el => cloudRun(el, async () => { await Cloud.refreshInfo(); await Cloud.pull(); if (Cloud.cfg.dirty) await Cloud.push(); }),
  'cloud-copy': async el => {
    const value = el.dataset.id === 'link' ? Cloud.inviteLink() : Cloud.cfg.inviteCode;
    try { await navigator.clipboard.writeText(value); toast(t('cCopied'), 'success'); } catch (_) { toast(value); }
  },
  'cloud-new-invite': el => cloudRun(el, async () => { if (!(await askConfirm(t('cNewInviteConfirm')))) return; await Cloud.newInvite(); toast(t('cNewInviteDone'), 'success'); }),
  'cloud-signout': el => cloudRun(el, async () => { if (!(await askConfirm(t('cSignOutConfirm')))) return; await Cloud.signOut(); }),
  'cloud-leave': el => cloudRun(el, async () => { if (!(await askConfirm(t('cLeaveConfirm'), { danger: true, okLabel: t('cLeave') }))) return; await Cloud.leave(); }),
  'cloud-disconnect': async () => { if (!(await askConfirm(t('cDisconnectConfirm')))) return; Cloud.disconnect(); ui.cloudRendered = null; render(); },
  'cloud-open': () => openCloudSection()
});
