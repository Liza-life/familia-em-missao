<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%9F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5fb;--card:#ffffff;--text:#22223b;--muted:#6b7280;--line:#e6e8f0;
  --primary:#6c63ff;--primary2:#8b5cf6;--success:#14935e;--danger:#dc3b2f;--warning:#c27c0e;
  --sidebar1:#24243e;--sidebar2:#302b63;--active-menu:rgba(255,255,255,.15);
  --accent:#6c63ff;--accent-soft:#f1efff;--tint:#eef1ff;
  --shadow:0 10px 30px rgba(43,39,78,.08);--radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(135deg,var(--bg),var(--tint));color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:21px}
h3{font-size:17px}
small,.muted{color:var(--muted)}

/* ===== Estrutura ===== */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--sidebar1),var(--sidebar2));color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800}
.brand-name{line-height:1.15;word-break:break-word}
.brand-tag{font-size:12px;opacity:.75;margin:4px 0 0 2px}
.nav{display:grid;gap:4px;margin-top:22px}
.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:11px 13px;border-radius:12px;opacity:.86;display:flex;align-items:center;gap:8px;font-size:15px}
.nav button:hover{background:var(--active-menu);opacity:1}
.nav button.active{background:var(--active-menu);opacity:1;font-weight:700}
.nav-badge{margin-left:auto;background:#ff5d73;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px}
.sidebar-foot{margin-top:auto;padding-top:18px;font-size:12px;opacity:.7}
.main{padding:24px 26px 60px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.title h1{font-size:28px}
.title p{margin:6px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mode-switch{display:flex;gap:4px;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.mode-switch button{border:0;background:transparent;border-radius:11px;padding:8px 12px;font-weight:800}
.mode-switch button.active{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.mode-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px}
.select-lang{width:auto;min-width:145px;font-weight:700}

/* ===== Componentes ===== */
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-soft{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.btn-ghost{background:#f2f3fa;color:var(--text)}
.btn-success{background:#e7f8ef;color:var(--success)}
.btn-danger{background:#fff0ef;color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.icon-btn{border:0;background:#f2f3fa;border-radius:10px;padding:6px 9px;font-size:13px;font-weight:700}
.icon-btn:hover{background:#e8e9f6}
.icon-btn.danger{color:var(--danger)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stack{display:grid;gap:10px}
.mt{margin-top:16px}
.card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.7);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(108,99,255,.12)}
textarea{min-height:90px;resize:vertical}
input[type=color]{height:42px;padding:3px;cursor:pointer}
input[type=checkbox]{width:auto}
.field{margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-top:12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:700;background:#fff;cursor:pointer;margin:0;user-select:none}
.chip input{display:none}
.chip.on{border-color:var(--primary);background:var(--accent-soft);color:var(--primary)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:#f2f3fa;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:#e7f8ef;color:var(--success)}
.pill.wait{background:#fff5e0;color:var(--warning)}
.pill.bad{background:#fff0ef;color:var(--danger)}
.pill.money{background:#e7f8ef;color:var(--success)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.notice{padding:12px 14px;border-radius:14px;background:#eef2ff;color:#3835a8;font-size:14px}
.notice.ok{background:#e7f8ef;color:#0f6b45}
.notice.warn{background:#fff5e0;color:#8a5300}
.kpi{font-size:30px;font-weight:900;line-height:1.1}
.kpi-label{color:var(--muted);font-size:13px;margin-top:4px}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.item .meta{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.item .meta>div{min-width:0}
.item strong{display:block;overflow-wrap:anywhere}
.item .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .money-line{font-size:12px;color:var(--success);font-weight:800;margin-top:2px}
.item.done{background:#f3fbf7;border-color:#cdeedd}
.item.wait{background:#fffaf0;border-color:#f6e2b3}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#f2f3fa;font-size:19px;flex:0 0 auto}
.right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto}
.progress{height:10px;background:#eceef7;border-radius:999px;overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.section{display:none}
.section.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Avatares e crianças ===== */
.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:29px;background:#f1f3ff;overflow:hidden;flex:0 0 auto;border:3px solid var(--c,var(--line))}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:34px;height:34px;font-size:17px;border-width:2px}
.avatar.lg{width:110px;height:110px;font-size:52px;border-width:4px}
.child-card{position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.child-card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(43,39,78,.14)}
.child-card:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.child-head{display:flex;gap:12px;align-items:center}
.child-head h3{font-size:18px}
.score{font-size:28px;font-weight:900;margin-top:14px}
.child-card .progress span{background:var(--p,var(--c))}
.today-line{margin-top:10px;font-size:12px;font-weight:800;color:var(--muted)}
.picker-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.picker{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-radius:16px;border:2px solid transparent;background:#fff;box-shadow:var(--shadow);cursor:pointer;font-weight:800}
.picker.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.picker small{display:block;font-weight:600}

/* ===== Modais ===== */
.modal{position:fixed;inset:0;background:rgba(18,18,34,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
.modal.open{display:flex}
.modal.top{z-index:70}
.modal-box{background:#fff;width:min(560px,100%);max-height:calc(100dvh - 36px);display:flex;flex-direction:column;border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal-body{overflow:auto;flex:1 1 auto;min-height:0;margin:0 -4px;padding:0 4px 4px;-webkit-overflow-scrolling:touch}
.sheet-grip{display:none}
.modal-box.wide{width:min(780px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.x{border:0;background:#f2f3fa;border-radius:10px;width:36px;height:36px;font-size:16px;flex:0 0 auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding-top:14px;margin-top:6px;border-top:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:2px solid var(--line);border-radius:16px;background:#fff;transition:transform .15s,border-color .15s}
.choice:hover,.choice:focus-visible{transform:translateY(-2px);border-color:var(--c);outline:none}
.choice.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#fff)}
.choice strong{font-size:15px;text-align:center}
.choice small{font-weight:700}
.tag{font-size:11px;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:2px 8px}
.pin-error{color:var(--danger);font-size:13px;font-weight:700;margin-top:8px}

/* ===== Calendário (visual do original: cada dia da semana com sua cor) ===== */
.calendar-shell{position:relative;overflow:hidden}
.calendar-shell:before{content:"";position:absolute;inset:-80px auto auto -80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(108,99,255,.16),transparent 68%);pointer-events:none}
.calendar-shell:after{content:"";position:absolute;right:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.13),transparent 70%);pointer-events:none}
.calendar-shell>*{position:relative;z-index:1}
.cal-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.cal-sum-card{padding:14px;border-radius:16px;background:linear-gradient(135deg,#fff,#f7f7ff);border:1px solid var(--line);box-shadow:0 8px 22px rgba(43,39,78,.06);position:relative}
.cal-sum-card strong{display:block;font-size:24px}
.cal-sum-card span{font-size:12px;color:var(--muted)}
.cal-sum-card .cal-sum-ico{position:absolute;right:12px;top:10px;font-size:20px;opacity:.8}
.cal-legend{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:2px 0 16px}
.cal-legend-item{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:700}
.cal-legend-item .dot{width:10px;height:10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 14px}
.cal-head h2{text-align:center}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wd{text-align:center;font-weight:800;color:#4b4668;font-size:13px;padding:8px 4px;border-radius:12px;background:linear-gradient(135deg,#f5f3ff,#fff);border:1px solid rgba(108,99,255,.10);text-transform:capitalize}
.day{min-height:104px;border-radius:14px;padding:10px;background:#fff;border:1px solid var(--line);cursor:pointer;position:relative;overflow:hidden;box-shadow:0 7px 18px rgba(43,39,78,.07);transition:transform .18s ease,box-shadow .18s ease}
.day:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(43,39,78,.12)}
.day.weekday-0{background:linear-gradient(145deg,#fff1f3,#fff8f8);border-color:#ffd7de}
.day.weekday-1{background:linear-gradient(145deg,#eef5ff,#f9fbff);border-color:#cfe0ff}
.day.weekday-2{background:linear-gradient(145deg,#eefcf5,#fbfffd);border-color:#ccefdc}
.day.weekday-3{background:linear-gradient(145deg,#fff8e8,#fffdf7);border-color:#f6e2aa}
.day.weekday-4{background:linear-gradient(145deg,#f7efff,#fcf9ff);border-color:#e4d0ff}
.day.weekday-5{background:linear-gradient(145deg,#fff0f7,#fffafd);border-color:#f6cfe1}
.day.weekday-6{background:linear-gradient(145deg,#eefbff,#f9feff);border-color:#c9edf5}
.day.out{opacity:.55;filter:saturate(.65);cursor:default}
.day.out:hover{transform:none;box-shadow:0 7px 18px rgba(43,39,78,.07)}
.day-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.day .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:16px;font-weight:900;color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.12);flex:0 0 auto}
.weekday-0 .num{background:linear-gradient(135deg,#fb7185,#e11d48)}
.weekday-1 .num{background:linear-gradient(135deg,#60a5fa,#2563eb)}
.weekday-2 .num{background:linear-gradient(135deg,#34d399,#059669)}
.weekday-3 .num{background:linear-gradient(135deg,#fbbf24,#d97706)}
.weekday-4 .num{background:linear-gradient(135deg,#a78bfa,#7c3aed)}
.weekday-5 .num{background:linear-gradient(135deg,#f472b6,#db2777)}
.weekday-6 .num{background:linear-gradient(135deg,#22d3ee,#0891b2)}
.day-name{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.45px;padding:5px 7px;border-radius:999px;background:rgba(255,255,255,.75);color:#5e5974;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.day-deco{position:absolute;right:9px;bottom:7px;font-size:17px;opacity:.45}
.day.today{border:2px solid var(--primary);box-shadow:0 10px 26px rgba(108,99,255,.20)}
.day.today .day-name{background:var(--primary);color:#fff}
.day.has{box-shadow:0 10px 25px rgba(43,39,78,.13)}
.day.has .day-deco{opacity:.9}
.day-rows{margin-top:8px;display:grid;gap:4px}
.day-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(255,255,255,.72);padding:4px 6px;border-radius:8px}
.day-count{display:inline-block;font-size:11px;font-weight:800;margin-top:6px;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.78)}
.month-message{margin-top:16px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#fff8e8,#fff);border:1px solid #f5dfae;display:flex;align-items:center;gap:12px}
.month-message-icon{font-size:28px}
.month-message strong{display:block}
.month-message span{color:var(--muted);font-size:14px}
@media(max-width:900px){.day-name{display:none}}
@media(max-width:760px){
  .cal-summary{grid-template-columns:1fr 1fr}
  .calendar{gap:5px}
  .wd{font-size:11px;padding:6px 1px}
  .day{min-height:66px;padding:5px;border-radius:11px}
  .day .num{width:26px;height:26px;font-size:13px;border-radius:9px}
  .day-rows{display:none}
  .day-count{font-size:10px;padding:2px 6px;margin-top:4px}
  .day-count span{display:none}
  .day-count b:before{content:"✔ "}
  .day-deco{font-size:13px;right:5px;bottom:3px}
}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--c)}
.day-count{font-size:11px;font-weight:800;margin-top:4px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;background:#fff}

/* ===== Análise e gráficos ===== */
.score-badge{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:#fff;border-radius:18px;padding:14px 20px;text-align:center;min-width:120px}
.score-badge strong{display:block;font-size:30px}
.score-badge span{font-size:12px;font-weight:700}
.mini-kpi{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.mini-kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.mini-kpi strong{display:block;font-size:22px;margin-top:4px}
.chart-svg{width:100%;height:180px;display:block}
.donut{width:150px;height:150px;margin:auto;display:block}
.bar-row{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:14px;margin:8px 0}
.bar{height:12px;background:#eceef7;border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--c);border-radius:999px}
.timeline{display:grid;gap:8px}
.tl{padding:9px 12px;border-left:4px solid var(--success);background:#fafbff;border-radius:10px;font-size:14px}
.tl.negative,.tl.rejected{border-left-color:var(--danger)}
.tl.pending{border-left-color:var(--warning)}
.tl small{display:block}
.level-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c) var(--pct),#eceef7 0);flex:0 0 auto}
.level-ring span{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:18px}
.medals{font-size:20px;letter-spacing:2px}
.hero{border-radius:var(--radius);padding:20px 22px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:var(--shadow)}
.hero h2{font-size:24px}
.hero p{margin:6px 0 0;opacity:.9}
.big-money{font-size:34px;font-weight:900;color:var(--success)}
.note-item{padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;background:#fff}
.note-item.unread{background:#fbfaff}
.note-text{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}

/* ===== Configurações ===== */
.theme-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.theme-card{border:2px solid transparent;border-radius:16px;padding:10px;background:#fff;box-shadow:var(--shadow);text-align:left}
.theme-card.on{border-color:var(--primary)}
.theme-prev{height:50px;border-radius:12px;display:grid;grid-template-columns:38% 62%;overflow:hidden;margin-bottom:8px}
.theme-prev i{display:block}
.theme-prev b{display:grid;place-items:center;background:#f6f7fb}
.theme-prev b span{width:56px;height:18px;border-radius:8px}
.color-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px}
.color-row label{margin:0}
.color-row input{width:56px;flex:0 0 auto}
.profile-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff;flex-wrap:wrap}
.switch{position:relative;display:inline-block;width:50px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d7d9e5;border-radius:999px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span:before{transform:translateX(22px)}

/* ===== Boas-vindas ===== */
.steps{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.steps span{flex:1;min-width:90px;text-align:center;padding:8px;border-radius:10px;background:#f2f3fa;font-size:12.5px;font-weight:800;color:var(--muted)}
.steps span.on{background:var(--accent-soft);color:var(--primary)}

/* ===== Avisos ===== */
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:90;max-width:min(380px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 14px;border-radius:14px;background:#22223b;color:#fff;box-shadow:0 14px 34px rgba(0,0,0,.25);font-size:14px;font-weight:600;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:none}
.toast.success{background:#147a52}
.toast.error{background:#b42318}
.toast.warn{background:#9a5b00}
.toast button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:9px;padding:6px 10px;font-weight:800;flex:0 0 auto}

/* ===== Modo criança ===== */
body.child-mode{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 6%,#fff),color-mix(in srgb,var(--accent) 14%,#fff))}
body.child-mode .card{border-color:color-mix(in srgb,var(--accent) 16%,#fff)}
body.child-mode h2{color:color-mix(in srgb,var(--accent) 80%,#000)}
.parent-only{}
body.child-mode .parent-only{display:none!important}
body:not(.child-mode) .child-only{display:none!important}

/* ===== Responsivo ===== */
@media(max-width:1100px){.g3{grid-template-columns:1fr 1fr}.theme-grid{grid-template-columns:1fr 1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}

  .g2,.g3,.row2{grid-template-columns:1fr}
  .title h1{font-size:24px}
}
@media(max-width:520px){.theme-grid{grid-template-columns:1fr}.item{flex-wrap:wrap}.right{justify-content:flex-start}}
@media print{
  .sidebar,.actions,.btn,.icon-btn,.toasts,.modal,.no-print{display:none!important}
  .app{display:block}.main{padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ddd}
}

.cloud-chip{border:0;cursor:pointer;font-size:12.5px;padding:7px 11px}
.cloud-chip.ok{background:#e7f8ef;color:var(--success)}

/* ===== Celular ===== */
.mobilebar,.tabbar,.drawer-backdrop,.drawer-x,.drawer-tools{display:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.install-steps{padding-left:20px;margin:8px 0 0}
.install-steps li{margin-bottom:8px}
html{-webkit-tap-highlight-color:transparent}

  .mb-title{flex:1;min-width:0;line-height:1.15}

  .mb-mode{display:flex;align-items:center;gap:6px;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:4px 10px 4px 5px;font-weight:800;font-size:12.5px;max-width:42%;flex:0 0 auto}

  .app{display:block}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);height:100dvh;z-index:60;transform:translateX(-105%);transition:transform .25s ease;padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));box-shadow:12px 0 40px rgba(0,0,0,.3)}

  .drawer-backdrop{display:block;position:fixed;inset:0;background:rgba(18,18,34,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .25s}

  body.menu-open{overflow:hidden}
  .drawer-x{display:grid;place-items:center;background:rgba(255,255,255,.14);color:#fff}
  .nav{grid-template-columns:1fr;margin-top:14px}
  .nav button{font-size:15px;padding:12px 13px}
  .drawer-tools{display:grid;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
  .drawer-tools label{color:#fff;opacity:.8;margin:0}
  .drawer-tools .mode-switch{box-shadow:none;justify-content:stretch}
  .drawer-tools .mode-switch button{flex:1}
  .sidebar-foot{display:block}
  .main{padding:14px 12px 24px}
  .topbar{margin-bottom:12px}
  .topbar .title h1{display:none}
  .topbar .title p{margin:0;font-size:13.5px}
  .topbar .actions{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(43,39,78,.08)}
  .tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted);position:relative;min-width:0}
  .tabbar button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar .ti{font-size:21px;line-height:1.1}
  .tabbar button.on{color:var(--primary);background:var(--accent-soft)}
  .tab-badge{position:absolute;top:2px;right:calc(50% - 22px);background:#ff5d73;color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}
  .toasts{left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:none}
  input,select,textarea{font-size:16px}
  .card{padding:15px;border-radius:18px}
  .g4{grid-template-columns:1fr 1fr}
  .g4>.child-card,.g4>.card:only-child{grid-column:auto}
  .child-head h3{font-size:16px}
  .score{font-size:24px;margin-top:10px}
  .kpi{font-size:24px}
  .btn{padding:11px 14px}
  .btn-sm{padding:9px 11px}
  .icon-btn{padding:8px 10px}

  .right{gap:6px}
  [data-task-row] .right{width:100%;justify-content:flex-start}

  .modal-box,.modal-box.wide{width:100%;max-height:92dvh;border-radius:22px 22px 0 0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));animation:sheet .22s ease}
  .sheet-grip{display:block;width:42px;height:5px;border-radius:99px;background:#d9dbe6;margin:0 auto 8px;flex:0 0 auto}

}
@media(max-width:400px){.g4{grid-template-columns:1fr}}
@media(max-width:369px){.mb-mode span:last-child{display:none}.mb-mode{padding:4px}}

@media print{.mobilebar,.tabbar,.drawer-backdrop{display:none!important}}
@media(max-width:820px){body:has(.modal) .toasts{top:calc(10px + env(safe-area-inset-top));bottom:auto}}

/* ===== Inglês ===== */
.en-bars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:120px;margin-top:10px}
.en-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.en-bar span{width:100%;max-width:28px;border-radius:7px 7px 3px 3px;display:block}
.en-bar small{font-size:10px;color:var(--muted);white-space:nowrap}
.chip.on{border-color:var(--primary);background:var(--accent-soft);color:var(--primary)}
.pr-opt{width:100%;text-align:left;cursor:pointer;font:inherit}
.pr-opt:hover{border-color:var(--primary)}
/* ===== Impressão ===== */
#printArea{display:none}
@media print{
  @page{size:A4;margin:11mm}
  body.print-mode{padding:0!important;background:#fff!important}
  body.print-mode>*:not(#printArea){display:none!important}
  body.print-mode #printArea{display:block!important}
  .ps-page{break-after:page;page-break-after:always}
  .ps-page:last-child{break-after:auto;page-break-after:auto}
}
#printArea{font-family:Inter,"Segoe UI",system-ui,Arial,sans-serif;color:#1d1d2b;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#printArea h3{font-size:15px;margin:14px 0 6px}
/* relatório */
#printArea h4{margin:0 0 4px;font-size:12.5px}
.pr-hero{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;margin-bottom:10px;background:color-mix(in srgb,var(--c,#6c63ff) 13%,#fff);border:2px solid color-mix(in srgb,var(--c,#6c63ff) 45%,#fff)}
.pr-hero-txt{flex:1;min-width:0}
.pr-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c,#6c63ff) 75%,#000)}
.pr-av{width:66px;height:66px;border-radius:50%;object-fit:cover;border:3px solid var(--c,#6c63ff);display:grid;place-items:center;font-size:36px;flex:0 0 auto;background:#fff}
.pr-title{font-size:28px;font-weight:900;line-height:1.1}
.pr-sub{font-size:12.5px;color:#555}
.pr-star{text-align:center;background:#fff;border-radius:14px;padding:6px 12px;border:2px solid var(--c,#6c63ff)}
.pr-star b{display:block;font-size:22px;font-weight:900;white-space:nowrap}
.pr-star small{display:block;font-size:10px;font-weight:600;color:#666}
.pr-summary{font-size:14px;font-weight:600;margin:0 0 10px;padding:0 4px}
.pr-kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pr-kpis3{grid-template-columns:repeat(3,1fr);margin-bottom:10px}
.pr-kpi{border:1.5px solid #e2e2ea;border-radius:12px;padding:6px 6px 7px;text-align:center;background:#fafafe}
.pr-ki{display:block;font-size:16px;line-height:1.1}
.pr-kpi b{display:block;font-size:17px}
.pr-kpi>span:not(.pr-ki):not(.pr-bar){font-size:10px;color:#555;display:block;line-height:1.2}
.pr-kpi small{display:block;font-size:9.5px;color:#666}
.pr-kpi.pos b,.pos{color:#0f7a4c}
.pr-kpi.neg b,.neg{color:#b42318}
.pr-bar{display:block;height:6px;border-radius:6px;background:#e9e9f1;overflow:hidden;margin:4px 2px 1px}
.pr-bar i{display:block;height:100%;background:var(--c,#6c63ff);border-radius:6px}
.pr-grid{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:11px;border:1.5px solid #d9d9e3;border-radius:12px;overflow:hidden}
.pr-grid th,.pr-grid td{border-right:1px solid #e4e4ec;border-bottom:1px solid #e4e4ec;padding:4px 3px;text-align:center;vertical-align:middle}
.pr-grid th:last-child,.pr-grid td:last-child{border-right:0}
.pr-grid tbody tr:last-child td{border-bottom:0}
.pr-grid th{background:color-mix(in srgb,var(--c,#6c63ff) 14%,#fff);font-size:10.5px;text-transform:capitalize}
.pr-grid th small{display:block;font-weight:600;color:#666}
.pr-grid .pr-tl{text-align:left;width:38%;padding-left:8px}
.pr-grid td.pr-tl{font-weight:600}
.pr-grid td.pr-tl small{font-weight:500;color:#777}
.pr-ti{display:inline-block;width:20px;font-size:13px}
.pr-grid td.ok{color:#0f7a4c;font-size:15px;font-weight:900;background:#ecfaf2}
.pr-grid td.ok small{font-size:9px;margin-left:1px}
.pr-grid td.miss{color:#d0a4a0;font-size:13px}
.pr-grid td.off,.pr-off-sw{background:repeating-linear-gradient(45deg,#f1f1f5 0 4px,#e3e3ea 4px 8px)}
.pr-off-sw{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:middle;border:1px solid #ddd}
.pr-grid .pr-sum td{font-weight:800;background:#fafafe}
.pr-legend{font-size:10px;color:#666;margin:4px 2px 8px}
.pr-boxes{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.pr-box{border:1.5px solid #e2e2ea;border-top:4px solid #0f7a4c;border-radius:12px;padding:7px 9px;font-size:11px;break-inside:avoid}
.pr-box.bad{border-top-color:#d96b2b}
.pr-box.rw{border-top-color:#c27c0e}
.pr-box ul{margin:0;padding:0;list-style:none}
.pr-box li{padding:2px 0;border-bottom:1px dotted #e4e4ec;line-height:1.3}
.pr-box li:last-child{border-bottom:0}
.pr-box em{font-style:normal;font-weight:800;float:right;margin-left:6px}
.pr-box.good em{color:#0f7a4c}.pr-box.bad em{color:#b42318}.pr-box.rw em{color:#8a5300}
.pr-empty{color:#aaa;margin:0}
.pr-talk{margin-top:10px;border:1.5px dashed #bbb;border-radius:14px;padding:8px 14px}
.pr-talk h3{margin-top:6px!important}
.pr-feel{display:flex;align-items:center;gap:14px;font-size:12.5px}
.pr-feel span{font-size:24px;width:38px;height:38px;border:1.5px solid #ccc;border-radius:50%;display:grid;place-items:center}
.pr-lines span,.pr-goal span,.pr-sign span{display:block;border-bottom:1px solid #999;height:24px}
.pr-goal{display:flex;gap:8px;align-items:flex-end;margin-top:6px;font-size:12.5px}
.pr-goal span{flex:1}
.pr-sign{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:14px;font-size:11px;text-align:center;color:#555}
.pr-sign span{margin-bottom:3px}
.pr-foot{font-size:10px;color:#888;margin-top:14px}
/* família */
.pr-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pr-mini .pr-bar{grid-column:1/-1;margin:2px 0 0}

.pr-chips{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.pr-chips span{font-size:10.5px;background:#f4f4f8;border-radius:999px;padding:2px 8px;font-weight:700}
.pr-hi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pr-hi div{border:1.5px solid #f0d58a;background:#fffaf0;border-radius:12px;padding:6px 10px;font-size:12px}
.pr-hi small{display:block;color:#8a5300;font-size:10px}
.pr-hi b{font-size:14px}
/* quadro de tarefas */
.pr-chartgrid{font-size:12.5px}
.pr-chartgrid td{height:34px}
.pr-chartgrid .pr-tl{width:40%}
.pr-tn small{display:block;font-size:9.5px;color:#777;font-weight:500}
.pr-grid td.pts{font-weight:800;color:#8a5300;font-size:11px}
.pr-cb{display:inline-block;width:20px;height:20px;border:2px solid color-mix(in srgb,var(--c,#6c63ff) 70%,#333);border-radius:6px}
.pr-write{display:inline-block;width:80%;border-bottom:1.5px solid #888;height:18px}
.pr-en td{background:#f3f8ff}
.pr-big .pr-chartgrid{font-size:14px}
.pr-big .pr-chartgrid td{height:44px}
.pr-big .pr-ti{font-size:20px;width:28px}
.pr-big .pr-cb{width:26px;height:26px;border-radius:50%}
.pr-chart .pr-box{margin-top:8px;font-size:11.5px}
.pr-extras{display:flex;flex-wrap:wrap;gap:6px 14px}
.pr-extras span{white-space:nowrap}
.pr-tally{display:inline-block;width:70px;border-bottom:1px solid #999;height:12px;vertical-align:bottom}
.pr-cheer{text-align:center;font-weight:800;font-size:15px;margin-top:12px;color:color-mix(in srgb,var(--c,#6c63ff) 75%,#000)}
.pr-whogrid{font-size:11.5px}
.pr-whogrid .pr-tl{width:36%}
.pr-whogrid td.when{font-size:10px;color:#555}
.pr-whogrid td.ok{font-size:16px;background:none}
.pr-whogrid th small{font-size:9.5px;color:#444}
.pr-group{margin:16px 0 6px;font-size:13px;color:var(--muted)}
/* plano da família (tela) */
.plan-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;background:#f3efff}
.plan-banner .actions{display:flex;gap:6px;align-items:center}
.plan-child{border:1.5px solid var(--line,#e6e6ef);border-left:5px solid var(--c);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.plan-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.plan-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.plan-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:var(--soft,#f6f6fb);cursor:pointer;font-weight:400;margin:0}
.plan-item input{width:18px;height:18px;flex:0 0 auto;margin:0}
.plan-item.has{opacity:.6}
.plan-name{display:flex;flex-direction:column;line-height:1.2}
.plan-name small{color:var(--muted);font-size:11.5px}
/* provinha */
.ws-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:3px solid #1d1d2b;padding-bottom:8px;margin-bottom:8px}
.ws-title{font-size:28px;font-weight:900}
.ws-sub{font-size:13px;color:#444}
.ws-name{font-size:14px;line-height:1.7;text-align:right}
.ws-score{border:2px solid #1d1d2b;border-radius:8px;padding:2px 8px;display:inline-block;margin-top:2px}
.ws-sec{border:1.5px solid #ccc;border-radius:12px;padding:8px 12px;margin-top:9px;break-inside:avoid;page-break-inside:avoid}
.ws-sec h3{margin:0 0 2px;font-size:17px!important}
.ws-num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#1d1d2b;color:#fff;font-size:13px;margin-right:4px}
.ws-help{font-size:11px;color:#666;margin:0 0 6px;font-style:italic}
.ws-row{display:flex;align-items:center;gap:14px;padding:5px 0;border-bottom:1px dotted #ddd}
.ws-row:last-child{border-bottom:0}
.ws-idx{font-weight:800;width:22px}
.ws-pic{font-size:40px;line-height:1.1}
.ws-picsm{font-size:30px}
.ws-say{font-size:11px;color:#777;margin-left:auto}
.ws-count{font-size:26px;letter-spacing:2px;flex:1}
.ws-opts{display:flex;gap:10px;margin-left:auto}

.ws-optw{border-radius:20px;font-size:17px}
.ws-box{width:70px;height:46px;border:2px solid #1d1d2b;border-radius:8px;margin-left:auto}
.ws-grid2,.ws-grid3,.ws-grid4{display:grid;gap:10px}

.ws-cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px}
.ws-circle{width:74px;height:74px;border:3px solid #1d1d2b;border-radius:50%}
.ws-square{width:74px;height:60px;border:3px solid #1d1d2b;border-radius:8px}
.ws-word{font-size:18px;letter-spacing:1px}
.ws-tick{font-size:22px}
.ws-hint{font-size:22px;letter-spacing:3px;font-weight:700}
.ws-big{font-size:28px;width:44px;text-align:center}
.ws-line{flex:1;border-bottom:2px solid #1d1d2b;height:30px;min-width:120px}
.ws-inline{display:inline-block;flex:none;width:130px;height:20px;vertical-align:bottom}
.ws-scr{font-size:22px;letter-spacing:4px;min-width:120px}
.ws-sent{font-size:19px;flex:1}
.ws-match{display:grid;grid-template-columns:1fr 1fr;gap:60px;padding:4px 20px}
.ws-mw,.ws-mp{display:flex;align-items:center;justify-content:space-between;height:50px}
.ws-mw b{font-size:20px}
.ws-dot{font-size:14px}
.ws-drawcell{align-items:stretch}
.ws-drawcell b{font-size:17px}
.ws-drawbox{height:150px;border:2px dashed #999;border-radius:10px}
.ws-foot{text-align:center;font-size:16px;font-weight:800;margin-top:10px}
.ws-keylist{margin:0;padding-left:22px;font-size:14px;columns:2}
.ws-key .ws-sec{border-color:#9b94ff}
/* prévia na tela (usada pelos testes e se a impressão abrir em outra aba) */
@media screen{body.print-mode #printArea{display:none}}
.plan-sub{font-size:12px;font-weight:800;color:var(--muted);margin:8px 0 4px}
.plan-item.rm{background:#fff3f0}
/* ===== Quadro de tarefas (no app) ===== */
.q-card{border-top:5px solid var(--c)}
.q-hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,#fff);margin-bottom:12px}
.q-hero .avatar{width:56px;height:56px;font-size:30px}
.q-hero-txt{flex:1;min-width:140px}
.q-hero-txt small{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 75%,#000)}
.q-hero-txt h2{margin:0;font-size:24px}
.q-hero-txt span{font-size:13px;color:var(--muted)}
.q-week{display:flex;gap:6px}
.q-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.q-stats div{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#fff}
.q-stats b{display:block;font-size:20px}
.q-stats span{font-size:11.5px;color:var(--muted)}
.q-stats .pos{color:#0f7a4c}
.q-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.q-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;-webkit-overflow-scrolling:touch}
.q-grid{width:100%;border-collapse:separate;border-spacing:0;min-width:640px}
.q-grid th,.q-grid td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid #f0f1f6;font-size:13px;vertical-align:middle}
.q-grid thead th{background:color-mix(in srgb,var(--c) 14%,#fff);font-size:12px;text-transform:capitalize;color:#4b4668;letter-spacing:0}
.q-grid thead th small{display:block;font-weight:600;color:var(--muted)}
.q-grid thead th.q-th-today{background:var(--c);color:#fff}
.q-grid thead th.q-th-today small{color:#fff}
.q-grid tbody tr:last-child th,.q-grid tbody tr:last-child td{border-bottom:0}
.q-task{text-align:left!important;position:sticky;left:0;background:#fff;z-index:1;min-width:190px;max-width:260px;text-transform:none!important}
.q-grid thead .q-task{background:color-mix(in srgb,var(--c) 14%,#fff)}
.q-name{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:2px;font:inherit;text-align:left;cursor:pointer;color:inherit}
span.q-name{cursor:default}
.q-name b{display:block;font-size:13.5px;line-height:1.25}
.q-name small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.q-ico{font-size:22px;flex:0 0 auto;width:28px;text-align:center}
.q-pen{font-style:normal;font-size:11px;opacity:.35;margin-left:auto}
.q-name:hover .q-pen{opacity:1}
.q-pts input{width:56px;padding:6px 4px;text-align:center;font-weight:800;border-radius:10px}
.q-pts b{color:#8a5300}
.q-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 70%,#333);background:#fff;font-size:17px;font-weight:900;padding:0;cursor:pointer;color:#fff}
.q-btn.open{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent);animation:qpulse 2s infinite}
.q-btn.open:hover{background:color-mix(in srgb,var(--c) 20%,#fff)}
.q-btn.done{background:#16a34a;border-color:#16a34a}
.q-btn.wait{border-color:#f59e0b;background:#fff7e6;font-size:15px;cursor:default}
.q-btn.past{border-style:dashed;border-color:#c9cbd8;color:#b8bacb;font-size:15px}
.q-btn.past:hover{border-color:#16a34a;color:#16a34a}
.q-btn.miss{border:0;color:#d0a4a0;cursor:default;background:none}
.q-btn.fut{border:2px dashed #e1e2ea;cursor:default;width:28px;height:28px}
.q-off{background:repeating-linear-gradient(45deg,#f6f6f9 0 5px,#ececf2 5px 10px)}
.q-rest{color:#c4c6d4}
.q-today{background:color-mix(in srgb,var(--c) 7%,#fff)}
.q-ok{background:#effbf3}
.q-sum th,.q-sum td{font-weight:800;background:#fafafe}
@keyframes qpulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 10%,transparent)}}
.q-extras h3{margin:16px 0 8px;font-size:16px}
.q-foot{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-top:14px}
.q-en,.q-rw{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.q-en span{float:right;font-weight:800}
.q-en .progress{margin-top:8px}
.q-en .progress span{float:none;background:var(--c)}
.q-rw-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.q-rw-list span{font-size:12.5px;padding:4px 9px;border-radius:999px;background:#f4f4f8}
.q-rw-list span.ok{background:#e7f8ef;color:#0f6b45;font-weight:700}
.q-rw-list i{font-style:normal;font-weight:800;margin-left:2px}
@media(max-width:760px){
  .q-stats{grid-template-columns:1fr 1fr}
  .q-foot{grid-template-columns:1fr}
  .q-grid{min-width:560px}
  .q-task{min-width:150px;max-width:170px}
  .q-name b{font-size:12.5px}
  .q-btn{width:30px;height:30px}
  .q-pts input{width:46px}
}

.q-pages{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:10px;background:#dbeafe;color:#1d4ed8;font-weight:900}
.q-btn.add{border:2px dashed #93c5fd;color:#2563eb;background:#fff;font-size:18px}
.pr-compact th,.pr-compact td{padding:1px 3px;line-height:1.25}

.fw-grid .pr-compact th,.fw-grid .pr-compact td{padding:1px 2px}

.rw-idea{cursor:pointer}.rw-idea .meta input{width:18px;height:18px;margin:0 4px 0 0;flex:0 0 auto}
/* ===== Jogos e raciocínio ===== */
.g-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.g-stats{display:flex;gap:8px;flex-wrap:wrap}
.g-stats span{font-size:12.5px;font-weight:700;background:#f4f4f8;border-radius:999px;padding:4px 10px}
.g-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.g-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;border-radius:18px;border:1.5px solid var(--line);background:linear-gradient(145deg,#fff,#f6f4ff);cursor:pointer;font:inherit;color:inherit;text-align:center;transition:transform .15s,box-shadow .15s}

.g-tile[disabled]{opacity:.4;cursor:default}
.g-tile span{font-size:34px}
.g-tile b{font-size:15px}
.g-tile small{font-size:12px;color:var(--muted)}
.g-board{margin-top:14px;border:2px solid var(--primary);border-radius:20px;padding:14px;background:#fff}
.g-board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.g-board-head .hint{flex:1;margin:0}
.g-sud-play{display:grid;grid-template-columns:repeat(var(--n),1fr);max-width:min(100%,calc(var(--n)*58px));margin:0 auto;border:3px solid #1d1d2b;border-radius:10px;overflow:hidden}
.g-cell{aspect-ratio:1;border:1px solid #c9cbd8;background:#fff;font:inherit;font-size:24px;font-weight:800;cursor:pointer;color:#2563eb;padding:0}
.g-n9 .g-cell{font-size:18px}
.g-cell.fixed{color:#1d1d2b;background:#f4f4f8;cursor:default}

.g-cell.br{border-right:3px solid #1d1d2b}
.g-pad{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.g-key{min-width:50px;height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:24px;font-weight:800;cursor:pointer}
.g-key:active{transform:scale(.95)}
.g-key.erase{background:#f4f4f8;font-size:20px}
.g-mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:440px;margin:0 auto}

.g-mem8{grid-template-columns:repeat(4,1fr);max-width:400px}

.g-card{aspect-ratio:1;border-radius:14px;border:0;background:linear-gradient(135deg,var(--primary),#a78bfa);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 6px 14px rgba(43,39,78,.15)}

.g-card.ok{background:#ecfdf5;border-color:#16a34a}

.g-seq-play.emo span{font-size:34px}
.g-seq-play .g-q{background:#fef3c7;border:2px dashed #f59e0b}
.g-opts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

.g-opt.emo{font-size:36px}
.g-opt:hover{border-color:var(--primary)}
.g-feedback{text-align:center;font-weight:800;margin:10px 0 0}

.g-done{margin-top:14px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#ecfdf5,#fff);border:1.5px solid #86efac;text-align:center;font-size:16px}
.g-done .actions{justify-content:center;margin-top:10px}

.g-c4{max-width:420px;margin:0 auto}
.g-c4-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.g-c4-drop{height:34px;border-radius:10px;border:1.5px dashed #93c5fd;background:#eff6ff;color:#2563eb;font-weight:900;cursor:pointer}
.g-c4-drop[disabled]{opacity:.35;cursor:default}
.g-c4-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px;border-radius:16px;background:#2563eb}
.g-c4-cell{aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:inset 0 3px 6px rgba(0,0,0,.25)}
.g-c4-cell.p1{background:radial-gradient(circle at 35% 35%,#fca5a5,#dc2626)}
.g-c4-cell.p2{background:radial-gradient(circle at 35% 35%,#fde68a,#eab308)}
.g-c4-cell.win{outline:4px solid #22c55e;outline-offset:-2px}
.g-c4-cell.last{box-shadow:0 0 0 3px rgba(255,255,255,.8)}
.g-dam{display:grid;grid-template-columns:repeat(8,1fr);max-width:min(100%,440px);margin:0 auto;border:4px solid #7c4a1e;border-radius:8px;overflow:hidden}
.g-dcell{aspect-ratio:1;border:0;padding:0;background:#f3e2c7;display:grid;place-items:center;cursor:default}
.g-dcell.dark{background:#a46a3a;cursor:pointer}
.g-dcell.can .g-piece{box-shadow:0 0 0 3px #fde047}
.g-dcell.sel{background:#65a30d}
.g-dcell.tgt{background:#84cc16}
.g-dcell i{width:28%;height:28%;border-radius:50%;background:rgba(255,255,255,.75)}
.g-piece{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;font-size:clamp(10px,3.2vw,20px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.g-piece.p1{background:radial-gradient(circle at 35% 35%,#fff,#e5e7eb);border:2px solid #9ca3af}
.g-piece.p2{background:radial-gradient(circle at 35% 35%,#6b7280,#111827);border:2px solid #000}

/* ---------- utilidades ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function cleanId(v) { return String(v ?? '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 80); }
function num(v, fallback = 0) { const n = Number(String(v ?? '').replace(',', '.')); return Number.isFinite(n) ? n : fallback; }
function int(v, fallback = 0) { const n = parseInt(v, 10); return Number.isFinite(n) ? n : fallback; }
function round2(v) { return Math.round((Number(v) || 0) * 100) / 100; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function text(v, max) { return String(v ?? '').trim().slice(0, max); }
function hashPin(pin) {
  // hash simples para não guardar a senha em texto puro (compatível com versões anteriores)
  const str = 'familia-em-missao:' + String(pin);
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 'h1:' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function shade(hex, percent) {
  const n = parseInt(String(hex).replace('#', ''), 16);
  const f = v => clamp(Math.round(v * (100 + percent) / 100), 0, 255);
  return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1);
}

/* ---------- datas (sempre no horário local) ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function toDate(v) { return v instanceof Date ? v : new Date(v); }
function dayKey(d = new Date()) { d = toDate(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function monthKey(d = new Date()) { d = toDate(d); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
function weekKey(d = new Date()) { d = toDate(d); const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return dayKey(x); }
function keyToDate(key) { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function addDays(d, n) { const x = new Date(toDate(d)); x.setDate(x.getDate() + n); return x; }
function daysAgo(n) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - n); return d; }
function isoNow() { return new Date().toISOString(); }
function safeIso(v) { const t = Date.parse(v); return Number.isFinite(t) ? new Date(t).toISOString() : isoNow(); }
